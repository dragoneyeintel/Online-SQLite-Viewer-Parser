;\n\t\t\t\tvid.play().catch(e => console.error(\"Auto-play prevented\", e));\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\t// 2. Fallback to backend analysis for complex structures (SQLite, KTX, Plist)\n\t\t\tfetch(`${apiBase}/analyze-blob`, {\n\t\t\t\tmethod: 'POST',\n\t\t\t\theaders: { 'Content-Type': 'application/json' },\n\t\t\t\tbody: JSON.stringify({ mode: 'preview', data: blobObj.data })\n\t\t\t})\n\t\t\t.then(r => r.json())\n\t\t\t.then(res => {\n\t\t\t\tif (res.type === 'image') {\n\t\t\t\t\timg.src = `data:image/png;base64,${res.data}`;\n\t\t\t\t\timg.style.display = 'block';\n\t\t\t\t} else {\n\t\t\t\t\ttxt.innerText = res.data || \"No preview available\";\n\t\t\t\t\ttxt.style.display = 'block';\n\t\t\t\t}\n\t\t\t\tbox.style.display = 'flex';\n\t\t\t});\n\t\t}, 150); \n\t}\n\n\t\n\t\n\t// Cell-aware Context Menu\n\tfunction showContextMenu(e, rowIdx, colIdx) {\n\t\te.preventDefault();\n\t\tif (contextMenu) contextMenu.remove();\n\n\t\tconst key = `${rowIdx}:${colIdx}`;\n\t\tif (!selectedCells.has(key)) {\n\t\t\tselectedCells.clear();\n\t\t\tselectedCells.add(key);\n\t\t\tapplySelectedCellStyles();\n\t\t\tselectRow(rowIdx);\n\t\t}\n\n\t\tcontextMenu = document.createElement('div');\n\t\tcontextMenu.className = 'custom-context-menu';\n\t\tcontextMenu.style.top = `${e.pageY}px`;\n\t\tcontextMenu.style.left = `${e.pageX}px`;\n\n\t\tconst multi = selectedCells.size > 1;\n\t\tcontextMenu.innerHTML = `\n\t\t\t<div class=\"menu-item\" onclick=\"${multi ? 'copySelectedAsJSON()' : 'copySingleCell()'}\">${multi ? 'Copy as JSON' : 'Copy'}<\/div>\n\t\t\t<div class=\"menu-item\" onclick=\"exportSelectionToPNG()\">Export to PNG<\/div>\n\t\t\t<div class=\"menu-item\" onclick=\"jumpToRowInHex(${rowIdx})\">Open In Hex View<\/div>\n\t\t`;\n\t\tdocument.body.appendChild(contextMenu);\n\t\tconst closeMenu = () => { contextMenu?.remove(); document.removeEventListener('click', closeMenu); };\n\t\tsetTimeout(() => document.addEventListener('click', closeMenu), 10);\n\t}\n\n\tfunction copySingleCell() {\n\t\tif (selectedCells.size === 0) return;\n\t\tconst key = [...selectedCells][0];\n\t\tconst [rowIdx, colIdx] = key.split(':').map(Number);\n\t\tconst row = rowCache[rowIdx];\n\t\tconst colName = currentDataColumnsCache[colIdx];\n\t\tconst val = row ? row[colName] : null;\n\t\tconst text = val === null || val === undefined ? '' : (typeof val === 'object' ? JSON.stringify(val) : String(val));\n\t\tnavigator.clipboard.writeText(text);\n\t\tif (contextMenu) contextMenu.remove();\n\t}\n\n\tfunction copySelectedAsJSON() {\n\t\tconst items = [];\n\t\t[...selectedCells].sort().forEach(key => {\n\t\t\tconst [rowIdx, colIdx] = key.split(':').map(Number);\n\t\t\tconst row = rowCache[rowIdx];\n\t\t\tconst colName = currentDataColumnsCache[colIdx];\n\t\t\tconst val = row ? row[colName] : null;\n\t\t\titems.push({ row: row?._rowid_ ?? rowIdx, column: colName, value: val });\n\t\t});\n\t\tnavigator.clipboard.writeText(JSON.stringify(items, null, 2));\n\t\tif (contextMenu) contextMenu.remove();\n\t}\n\n\tfunction applySelectedCellStyles() {\n\t\tdocument.querySelectorAll('#mainSqlTable td.selected-cell').forEach(td => td.classList.remove('selected-cell'));\n\t\tselectedCells.forEach(key => {\n\t\t\tconst [r, c] = key.split(':').map(Number);\n\t\t\tconst tr = document.getElementById(`row-${r}`);\n\t\t\tif (tr) {\n\t\t\t\tconst td = tr.cells[c];\n\t\t\t\tif (td) td.classList.add('selected-cell');\n\t\t\t}\n\t\t});\n\t}\n\n\tfunction fillTextEllipsis(ctx, text, x, y, maxWidth) {\n\t\tif (!text || ctx.measureText(text).width <= maxWidth) {\n\t\t\tctx.fillText(text || '', x, y);\n\t\t\treturn;\n\t\t}\n\t\tconst ellipsis = '\\u2026';\n\t\tconst ew = ctx.measureText(ellipsis).width;\n\t\tlet t = text;\n\t\twhile (t.length > 0 && ctx.measureText(t).width + ew > maxWidth) t = t.slice(0, -1);\n\t\tctx.fillText(t + ellipsis, x, y);\n\t}\n\n\tfunction exportSelectionToPNG() {\n\t\tif (contextMenu) contextMenu.remove();\n\t\tif (selectedCells.size === 0) return;\n\n\t\tconst table = document.getElementById('mainSqlTable');\n\t\tif (!table) return;\n\n\t\t// Read actual column widths and row heights directly from the live DOM\n\t\tconst thEls = Array.from(table.querySelectorAll('thead th'));\n\t\tconst domColWidths = thEls.map(th => th.offsetWidth);\n\t\tconst firstDataRow = table.querySelector('tbody tr');\n\t\tconst DOM_ROW_H = firstDataRow ? firstDataRow.offsetHeight : 26;\n\t\tconst DOM_HDR_H = thEls.length > 0 ? thEls[0].offsetHeight : 30;\n\n\t\t// Build row->col map\n\t\tconst rowsMap = new Map();\n\t\tselectedCells.forEach(key => {\n\t\t\tconst [rowIdx, colIdx] = key.split(':').map(Number);\n\t\t\tif (!rowsMap.has(rowIdx)) rowsMap.set(rowIdx, new Map());\n\t\t\trowsMap.get(rowIdx).set(colIdx, true);\n\t\t});\n\n\t\tconst colIdxSet = new Set([...selectedCells].map(k => parseInt(k.split(':')[1])));\n\t\tconst sortedColIdxs = [...colIdxSet].sort((a, b) => a - b);\n\t\tconst sortedRowIdxs = [...rowsMap.keys()].sort((a, b) => a - b);\n\t\tconst headers = sortedColIdxs.map(ci => currentDataColumnsCache[ci]);\n\n\t\t// Get display text via formatCell (same as the viewer \u2014 blobs show descriptive text, nulls show null)\n\t\tconst tmpDiv = document.createElement('div');\n\t\tconst tableRows = sortedRowIdxs.map(ri => sortedColIdxs.map(ci => {\n\t\t\tconst row = rowCache[ri];\n\t\t\tif (!row) return '';\n\t\t\ttmpDiv.innerHTML = formatCell(row[currentDataColumnsCache[ci]], ri);\n\t\t\treturn (tmpDiv.textContent || '').trim();\n\t\t}));\n\n\t\t// Column widths from DOM\n\t\tconst colWidths = sortedColIdxs.map(ci => domColWidths[ci] || 100);\n\t\tconst ROW_H = DOM_ROW_H;\n\t\tconst HDR_H = DOM_HDR_H;\n\t\tconst CP = 12; // matches CSS padding: 8px 12px\n\n\t\tconst canvas = document.createElement('canvas');\n\t\tconst ctx = canvas.getContext('2d');\n\t\tconst FONT = '13px Consolas, monospace';\n\t\tconst HDR_FONT = 'bold 13px Consolas, monospace';\n\t\tconst META_FONT = '12px Segoe UI, sans-serif';\n\t\tconst BORDER_CLR = '#90EE90';\n\t\tconst BW = 6, PAD = 14, META_LH = 20;\n\n\t\tconst tableW = colWidths.reduce((s, w) => s + w, 0);\n\t\tctx.font = META_FONT;\n\t\tconst metaW = Math.max(\n\t\t\tctx.measureText('File: ' + (path || '')).width,\n\t\t\tctx.measureText('Table: ' + (currentTableName || '')).width\n\t\t);\n\t\tconst totalW = Math.max(tableW, metaW) + PAD * 2 + BW * 2;\n\t\tconst metaH = META_LH * 2 + PAD * 2;\n\t\tconst tableH = HDR_H + tableRows.length * ROW_H;\n\t\tconst totalH = BW * 2 + metaH + tableH + PAD;\n\n\t\tcanvas.width = totalW;\n\t\tcanvas.height = totalH;\n\n\t\tconst CORNER_R = 10;\n\n\t\t// Clip all drawing to rounded rect so corners are transparent\n\t\tctx.save();\n\t\tctx.beginPath();\n\t\tctx.roundRect(BW / 2, BW / 2, totalW - BW, totalH - BW, CORNER_R);\n\t\tctx.clip();\n\t\tctx.fillStyle = '#0d1117';\n\t\tctx.fillRect(0, 0, totalW, totalH);\n\n\t\t// Meta lines\n\t\tconst metaX = BW + PAD;\n\t\tlet metaY = BW + PAD + META_LH;\n\t\tctx.font = META_FONT;\n\t\tctx.fillStyle = '#8b949e';\n\t\tctx.fillText('File:', metaX, metaY);\n\t\tctx.fillStyle = '#e6edf3';\n\t\tctx.fillText(' ' + (path || '(unknown)'), metaX + ctx.measureText('File:').width, metaY);\n\t\tmetaY += META_LH;\n\t\tctx.fillStyle = '#8b949e';\n\t\tctx.fillText('Table:', metaX, metaY);\n\t\tctx.fillStyle = '#e6edf3';\n\t\tctx.fillText(' ' + (currentTableName || '(unknown)'), metaX + ctx.measureText('Table:').width, metaY);\n\n\t\tconst tblX = BW + PAD;\n\t\tconst tblY = BW + metaH;\n\n\t\t// Header row\n\t\tctx.fillStyle = '#21262d';\n\t\tctx.fillRect(tblX, tblY, tableW, HDR_H);\n\t\tctx.font = HDR_FONT;\n\t\tctx.fillStyle = '#58a6ff';\n\t\tlet xOff = tblX + CP;\n\t\theaders.forEach((h, i) => {\n\t\t\tfillTextEllipsis(ctx, h, xOff, tblY + HDR_H / 2 + 4, colWidths[i] - CP * 2);\n\t\t\txOff += colWidths[i];\n\t\t});\n\n\t\t// Data rows\n\t\tctx.font = FONT;\n\t\ttableRows.forEach((row, ri) => {\n\t\t\tconst y = tblY + HDR_H + ri * ROW_H;\n\t\t\tctx.fillStyle = ri % 2 === 0 ? '#0d1117' : '#161b22';\n\t\t\tctx.fillRect(tblX, y, tableW, ROW_H);\n\t\t\tctx.fillStyle = '#e6edf3';\n\t\t\tlet xOff = tblX + CP;\n\t\t\trow.forEach((cell, ci) => {\n\t\t\t\tfillTextEllipsis(ctx, cell, xOff, y + ROW_H / 2 + 4, colWidths[ci] - CP * 2);\n\t\t\t\txOff += colWidths[ci];\n\t\t\t});\n\t\t});\n\n\t\t// Grid lines\n\t\tctx.strokeStyle = '#30363d';\n\t\tctx.lineWidth = 1;\n\t\t[0, HDR_H, ...tableRows.map((_, i) => HDR_H + (i + 1) * ROW_H)].forEach(dy => {\n\t\t\tctx.beginPath(); ctx.moveTo(tblX, tblY + dy); ctx.lineTo(tblX + tableW, tblY + dy); ctx.stroke();\n\t\t});\n\t\tlet vx = tblX;\n\t\t[0, ...colWidths].forEach(w => {\n\t\t\tctx.beginPath(); ctx.moveTo(vx, tblY); ctx.lineTo(vx, tblY + tableH); ctx.stroke();\n\t\t\tvx += w;\n\t\t});\n\n\t\t// End rounded clip, then draw green border on top\n\t\tctx.restore();\n\t\tctx.strokeStyle = BORDER_CLR;\n\t\tctx.lineWidth = BW;\n\t\tctx.beginPath();\n\t\tctx.roundRect(BW / 2, BW / 2, totalW - BW, totalH - BW, CORNER_R);\n\t\tctx.stroke();\n\n\t\tcanvas.toBlob(blob => {\n\t\t\tconst url = URL.createObjectURL(blob);\n\t\t\tconst a = document.createElement('a');\n\t\t\ta.href = url;\n\t\t\ta.download = (currentTableName || 'export') + '_selection.png';\n\t\t\tdocument.body.appendChild(a);\n\t\t\ta.click();\n\t\t\tdocument.body.removeChild(a);\n\t\t\tURL.revokeObjectURL(url);\n\t\t});\n\t}\n\n\tasync function jumpToRowInHex(rowIndex) {\n\t\tconst row = rowCache[rowIndex];\n\t\tif (!row || !row._rowid_) return;\n\n\t\t// 1. Fetch exact offset and size from the B-Tree walker\n\t\tconst res = await fetch(`${apiBase}/sqlite/query`, {\n\t\t\tmethod: 'POST',\n\t\t\theaders: { 'Content-Type': 'application/json' },\n\t\t\tbody: JSON.stringify({ \n\t\t\t\tdb_path: currentModePath, \n\t\t\t\tquery: \"__GET_ROW_PHYSICAL_OFFSET\",\n\t\t\t\tparams: [currentTableName, row._rowid_]\n\t\t\t})\n\t\t});\n\t\tconst data = await res.json();\n\t\tconsole.log('Offset Response:', data);\n\n\t\tif (!data || !data.offset) {\n\t\t\treturn alert(\"Physical offset not found in DB or WAL.\");\n\t\t}\n\n\t\t// Store the jump target \u2014 will be applied AFTER content is loaded\n\t\twindow.pendingJump = {\n\t\t\toffset: data.offset,\n\t\t\tsize: data.size || 32,     // fallback size if missing\n\t\t\tlabel: data.source === \"WAL\" ? \"WAL\" : \"DB\",\n\t\t\trowIndex: rowIndex         // optional \u2014 for debugging\n\t\t};\n\n\t\t// Switch mode (this will trigger loadHexView)\n\t\tconst hexTab = Array.from(document.querySelectorAll('.tab'))\n\t\t\t.find(t => t.innerText === 'Hex View');\n\t\tswitchMode('Hex', hexTab);\n\t}\n\t\n\tfunction jumpToOffsetFull(startOffset, totalSize, label) {\n\t\tconst sectionStartLine = sectionMap[label];\n\t\tif (!sectionStartLine) return;\n\n\t\tlet newHighlights = [];\n\t\tlet bytesRemaining = totalSize;\n\t\tlet currentOffset = startOffset;\n\n\t\twhile (bytesRemaining > 0) {\n\t\t\tconst row = Math.floor(currentOffset / 16);\n\t\t\tconst col = currentOffset % 16;\n\t\t\tconst bytesOnThisLine = Math.min(16 - col, bytesRemaining);\n\t\t\t\n\t\t\tconst targetLine = sectionStartLine + row;\n\n\t\t\tconst hexStart = 11 + (col * 3);\n\t\t\tconst hexEnd = hexStart + (bytesOnThisLine * 3) - 1;\n\n\t\t\tconst asciiStart = 61 + col;\n\t\t\tconst asciiEnd = asciiStart + bytesOnThisLine;\n\n\t\t\tnewHighlights.push(\n\t\t\t\t{ range: new monaco.Range(targetLine, hexStart, targetLine, hexEnd), options: { inlineClassName: 'hex-jump-highlight' } },\n\t\t\t\t{ range: new monaco.Range(targetLine, asciiStart, targetLine, asciiEnd), options: { inlineClassName: 'hex-jump-highlight' } }\n\t\t\t);\n\n\t\t\tcurrentOffset += bytesOnThisLine;\n\t\t\tbytesRemaining -= bytesOnThisLine;\n\t\t}\n\n\t\t// Apply forensic/header decorations separately (if any)\n\t\tconst forensicDecs = (label === \"DB\") ? getForensicDecs() : [];\n\t\tforensicDecorations = editor.deltaDecorations(forensicDecorations, forensicDecs);\n\t\t\n\t\t// Apply jump highlights separately\u2014removes any previous jump and adds new\n\t\tjumpDecorations = editor.deltaDecorations(jumpDecorations, newHighlights);\n\t\t\n\t\t// Reveal the top of the entry\n\t\teditor.revealLineInCenter(sectionStartLine + Math.floor(startOffset / 16));\n\t}\n\n\t// Helper to prevent HTML injection\n    function escapeHtml(unsafe) {\n        if (unsafe === null || unsafe === undefined) return '<i>null<\/i>';\n        return unsafe.toString().replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\");\n    }\n\n\tfunction handleBlobClick(e, b64Data) {\n\t\te.stopPropagation();\n\t\tfetch(`${apiBase}/analyze-blob`, {\n\t\t\tmethod: 'POST',\n\t\t\theaders: { 'Content-Type': 'application/json' },\n\t\t\tbody: JSON.stringify({ mode: 'view', data: b64Data })\n\t\t})\n\t\t.then(r => r.json())\n\t\t.then(res => {\n\t\t\tif (res.status === 'success' && res.url) PE.open(res.url, '_blank');\n\t\t\telse alert(\"Unable to open viewer.\");\n\t\t})\n\t\t.catch(err => console.error(\"Blob click error:\", err));\n\t}\n\n\tfunction handleBlobHover(e, b64Data) {\n\t\tclearTimeout(hoverTimeout);\n\t\thoverTimeout = setTimeout(() => {\n\t\t\tfetch(`${apiBase}/analyze-blob`, {\n\t\t\t\tmethod: 'POST',\n\t\t\t\theaders: { 'Content-Type': 'application/json' },\n\t\t\t\tbody: JSON.stringify({ mode: 'preview', data: b64Data })\n\t\t\t})\n\t\t\t.then(r => r.json())\n\t\t\t.then(res => {\n\t\t\t\tconst box = document.getElementById('hoverPreview');\n\t\t\t\tconst img = document.getElementById('previewImg');\n\t\t\t\tconst txt = document.getElementById('previewText');\n\t\t\t\t\n\t\t\t\timg.style.display = 'none'; \n\t\t\t\ttxt.style.display = 'none';\n\n\t\t\t\tif (res.type === 'image') {\n\t\t\t\t\timg.src = `data:image/png;base64,${res.data}`;\n\t\t\t\t\timg.style.display = 'block';\n\t\t\t\t} else {\n\t\t\t\t\t// Shows text preview or hex dump provided by the backend\n\t\t\t\t\ttxt.innerText = res.data || \"No preview available\";\n\t\t\t\t\ttxt.style.display = 'block';\n\t\t\t\t}\n\t\t\t\tbox.style.display = 'flex';\n\t\t\t})\n\t\t\t.catch(e => console.error(\"Preview failed\", e));\n\t\t}, 150); // Small delay to prevent API spam while scrolling\n\t}\n\n\tfunction hidePreview() {\n\t\tclearTimeout(hoverTimeout);\n\t\tdocument.getElementById('hoverPreview').style.display = 'none';\n\t\tdocument.getElementById('previewImg').src = ''; \n\t\t\n\t\tconst vid = document.getElementById('previewVideo');\n\t\tif(vid) {\n\t\t\tvid.pause();\n\t\t\tvid.src = '';\n\t\t}\n\t}\n\t\n\tfunction applyDynamicPageMap(pageMap) {\n        if (!editor || !pageMap || pageMap.length === 0) return;\n        \n        const baseLine = sectionMap[\"DB\"];\n        if (!baseLine) return;\n\n        // 1. Determine exactly where the DB section ends in the Monaco editor\n        let dbEndLine = editor.getModel().getLineCount();\n        if (sectionMap[\"WAL\"]) {\n            dbEndLine = sectionMap[\"WAL\"] - 2; // Stop before the empty line and WAL header\n        } else if (sectionMap[\"JRNL\"]) {\n            dbEndLine = sectionMap[\"JRNL\"] - 2; // Stop before the empty line and JRNL header\n        }\n        \n        let newDecorations = [];\n        \n        pageMap.forEach(page => {\n            const linesSpanned = page.size / 16;\n            const startLine = baseLine + ((page.page_num - 1) * linesSpanned);\n            let endLine = startLine + linesSpanned - 1;\n            \n            // 2. If the page starts AFTER the 16KB chunk we loaded, completely ignore it\n            if (startLine > dbEndLine) return; \n            \n            // 3. If the page gets cut off by the end of our 16KB chunk, clamp the highlight to the end line\n            if (endLine > dbEndLine) endLine = dbEndLine;\n            \n            let cssClass = 'page-hl-overflow';\n            let minimapColor = '#8b949e40'; \n            \n            if (page.page_num === 1) { cssClass = 'page-hl-header'; minimapColor = '#db61a240'; }\n            else if (page.flag === 0x0D) { cssClass = 'page-hl-leaf-table'; minimapColor = '#3fb95040'; }\n            else if (page.flag === 0x05) { cssClass = 'page-hl-interior-table'; minimapColor = '#d2992240'; }\n            else if (page.flag === 0x0A) { cssClass = 'page-hl-leaf-index'; minimapColor = '#58a6ff40'; }\n            else if (page.flag === 0x02) { cssClass = 'page-hl-interior-index'; minimapColor = '#a371f740'; }\n\n            const hoverMsg = `**Page ${page.page_num}**\\n\\n` +\n                             `**Type:** ${page.page_num === 1 ? 'DB Header & ' : ''}${page.type}\\n` +\n                             `**Offset:** ${page.offset_hex}\\n` +\n                             `**Size:** ${page.size} bytes\\n` +\n                             `**Signature:** \\`${page.signature}\\``;\n\n            newDecorations.push({\n                range: new monaco.Range(startLine, 1, endLine, 1),\n                options: {\n                    isWholeLine: true,\n                    className: cssClass,\n                    hoverMessage: { value: hoverMsg },\n                    minimap: {\n                        color: minimapColor,\n                        position: monaco.editor.MinimapPosition.Inline\n                    }\n                }\n            });\n        });\n\n        // Track page highlights separately so it doesn't overwrite your forensic header highlights!\n        pageDecorations = editor.deltaDecorations(pageDecorations, newDecorations);\n    }\n\t\n\tfunction applyUnallocatedHighlights(fragments) {\n        if (!editor || !fragments || fragments.length === 0) return;\n        \n        const baseLine = sectionMap[\"DB\"];\n        if (!baseLine) return;\n\n        // Determine the cutoff line so we don't highlight into the WAL/Journal\n        let dbEndLine = editor.getModel().getLineCount();\n        if (sectionMap[\"WAL\"]) dbEndLine = sectionMap[\"WAL\"] - 2;\n        else if (sectionMap[\"JRNL\"]) dbEndLine = sectionMap[\"JRNL\"] - 2;\n\n        let newDecorations = [];\n\n        fragments.forEach(frag => {\n            let currentOffset = frag.offs t-family: 'Fira Code', monospace; font-size: 12px; }\n\n        .str-item { padding: 4px 16px; cursor: pointer; border-bottom: 1px solid rgba(48,54,61,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n        .str-item:hover { background: #1f2428; color: var(--blue); }\n        .str-offset { color: var(--text-secondary); margin-right: 12px; font-size: 11px; }\n        .str-type { color: #d2a8ff; border: 1px solid #d2a8ff; padding: 1px 4px; border-radius: 3px; font-size: 10px; margin-right: 8px; }\n\t\t\n\t\t.hex-highlight {\n\t\t\tbackground-color: rgba(255, 255, 0, 0.3); /* Yellow highlight */\n\t\t\tborder: 1px solid #d29922;\n\t\t\tfont-weight: bold;\n\t\t}\n\t\t.line-highlight {\n\t\t\tbackground-color: #fff6c2; /* Darker background for the whole line */\n\t\t}\n\t\t\n\t\t/* --- Modal Styles --- */\n        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; }\n        .modal-window { background: var(--surface); width: 600px; height: 500px; border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }\n        .modal-header { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface2); font-weight: bold; }\n        .modal-body { flex: 1; overflow-y: auto; padding: 10px; }\n        .file-list-item { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; color: var(--text); }\n        .file-list-item:hover { background: var(--surface2); }\n        .file-icon { margin-right: 10px; width: 20px; text-align: center; }\n        .folder-item { color: var(--blue); }\n        .hex-item { color: var(--text); } \n        .modal-footer { padding: 10px; border-top: 1px solid var(--border); text-align: right; background: var(--surface); }\n        .breadcrumbs { padding: 5px 15px; background: var(--bg); font-family: monospace; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }\n    <\/style>\n<style id=\"retro-theme\">\n/* Retro desktop look for the viewers: white panes, grey chrome, 2px black borders, VT323 */\n@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');\n:root {\n  --bg: #ffffff; --surface: #e5e5e5; --surface2: #cccccc; --surface-hover: #f0f0f0;\n  --text: #000000; --text-secondary: #444444; --border: #000000;\n  --blue: #000000; --red: #b00000; --orange: #000000;\n  --key: #000000; --string: #333333; --number: #000000; --bool: #000000; --blob: #666666;\n}\n* { border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }\nhtml, body { font-family: 'VT323', monospace !important; font-size: 18px; background: var(--bg) !important; color: var(--text) !important; }\nbutton, input, select, textarea { font-family: 'VT323', monospace; font-size: 16px; }\nheader { background: var(--surface) !important; border-bottom: 2px solid #000 !important; height: auto !important; min-height: 42px; flex-wrap: wrap; gap: 6px; padding: 4px 10px !important; }\n#viewerTitle { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 18px !important; font-weight: bold; }\n.btn { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; padding: 1px 10px !important; font-size: 16px !important; cursor: pointer; }\n.btn:hover:not(:disabled) { background: #000 !important; color: #fff !important; }\n.btn:disabled { opacity: .45; }\n.active-btn { background: #000 !important; color: #fff !important; border-color: #000 !important; }\n.controls { background: #fff !important; border: 2px solid #000 !important; padding: 2px 6px !important; }\n.page-info { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\ninput.page-input, input[type=text], input[type=number], input[type=search], textarea, select { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.bottom-panel { background: #fff !important; border-top: 2px solid #000 !important; }\n.panel-header { background: var(--surface) !important; color: #000 !important; border-bottom: 2px solid #000 !important; font-size: 14px !important; }\n.panel-body { font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.str-item { border-bottom: 1px solid #999 !important; }\n.str-item:hover { background: #000 !important; color: #fff !important; }\n.str-offset { color: #555 !important; font-size: 14px !important; }\n.str-type { color: #000 !important; border: 1px solid #000 !important; font-size: 12px !important; }\n.resizer:hover { background: #000 !important; }\n.hex-highlight, .text-highlight { background-color: #ffe97a !important; border: 1px solid #000 !important; }\n.line-highlight { background-color: #fff6c2 !important; }\n.modal-overlay { background: rgba(0,0,0,.35) !important; }\n.modal-window { background: #fff !important; border: 2px solid #000 !important; }\n.modal-header, .modal-footer { background: var(--surface) !important; border-color: #000 !important; }\n::-webkit-scrollbar { width: 14px; height: 14px; } ::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }\n::-webkit-scrollbar-thumb { background: #ccc; border: 2px solid #000; }\n::selection { background: #000; color: #fff; }\n.drop-hint { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.85); border: 4px dashed #000; font-size: 28px; z-index: 5000; pointer-events: none; }\n.file-path { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 18px !important; font-weight: bold; }\n.viewer-body { background-color: #fff !important; background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%) !important; background-size: 20px 20px !important; background-position: 0 0,0 10px,10px -10px,-10px 0 !important; }\n.sep { background: #000 !important; }\n.zoom-label { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.btn-active { background: #000 !important; color: #fff !important; border-color: #000 !important; }\nimg#mainImage, img#ktxImage, video { border: 2px solid #000 !important; }\n.error { color: #b00000 !important; }\n.loading { color: #000 !important; }\n.badge, .badge-heic, .badge-live { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; }\n#loadingOverlay { background: rgba(255,255,255,.92) !important; }\n\n<\/style>\n<\/head>\n<body>\n<header>\n    <div style=\"display: flex; align-items: center; gap: 10px;\">\n        <span id=\"viewerTitle\">Loading...<\/span>\n        <button class=\"btn\" onclick=\"triggerExternalImport()\">Open File...<\/button>\n        <input type=\"file\" id=\"externalFileInput\" multiple style=\"display: none;\" accept=\"*\">\n    <\/div>\n    \n    <div class=\"controls\">\n        <button class=\"btn\" onclick=\"changePage(-10000)\">|&lt;<\/button>\n        <button class=\"btn\" onclick=\"changePage(-1)\">&lt;<\/button>\n        \n        <span class=\"page-info\">Page<\/span>\n        <input type=\"text\" id=\"pageInput\" class=\"page-input\" value=\"1\" onkeydown=\"if(event.key==='Enter') goToPage(this.value)\">\n        <span class=\"page-info\" id=\"totalPagesLabel\">of ?<\/span>\n        \n        <button class=\"btn\" onclick=\"changePage(1)\">&gt;<\/button>\n        <button class=\"btn\" onclick=\"changePage(10000)\">&gt;|<\/button>\n    <\/div>\n\n    <div style=\"display: flex; gap: 8px; margin-left: 10px;\">\n        <button id=\"onlyDiffsBtn\" class=\"btn\" style=\"display: none;\" onclick=\"toggleOnlyDiffs()\">Only Diffs<\/button>\n        <button class=\"btn\" onclick=\"toggleStringsPanel()\">Strings<\/button>\n        <button class=\"btn\" onclick=\"downloadCurrentFile()\">Download<\/button>\n    <\/div>\n<\/header>\n\n<div id=\"monacoContainer\"><\/div>\n\n<div id=\"stringsPanel\" class=\"bottom-panel\" style=\"height: 180px; display: none;\">\n    <div id=\"stringsResizer\" class=\"resizer\"><\/div>\n    <div class=\"panel-header\">\n        <span id=\"stringsCount\">Strings found: 0<\/span>\n        <span onclick=\"toggleStringsPanel()\" style=\"cursor:pointer;\">\u00d7<\/span>\n    <\/div>\n    <div id=\"stringsBody\" class=\"panel-body\"><\/div>\n<\/div>\n\n<script>\n    let editor = null;\n    let diffEditor = null;\n    let currentPage = 1;\n    let totalPages = 1;\n    let _onlyDiffsActive = false;\n\n    function toggleOnlyDiffs() {\n        _onlyDiffsActive = !_onlyDiffsActive;\n        document.getElementById('onlyDiffsBtn').classList.toggle('active-btn', _onlyDiffsActive);\n        if (diffEditor) diffEditor.updateOptions({ hideUnchangedRegions: { enabled: _onlyDiffsActive } });\n    }\n\n    // CONFIGURATION: 1024KB (1MB) Page Size\n    const pageSize = 1024 * 1024;\n\n    let currentDecorations = []; // To track and remove old highlights\n\n    const params = new URLSearchParams(window.PE_SEARCH);\n    const source      = params.get('source');\n    const _isFileDiff = source === 'filediff';\n    const _isDiff = !_isFileDiff;\n    const filePath = params.get('path');\n    const apiBase = '/api/local';\n\n    const leftPath  = _isFileDiff ? params.get('left')  : null;\n    const rightPath = _isFileDiff ? params.get('right') : null;\n\n    if (_isFileDiff) {\n        const lName = (leftPath  || '').split(/[\\\\/]/).pop();\n        const rName = (rightPath || '').split(/[\\\\/]/).pop();\n        document.getElementById('viewerTitle').textContent = `Hex Diff: ${lName} vs ${rName}`;\n    } else {\n        document.getElementById('viewerTitle').textContent = filePath || 'No file open';\n    }\n\n    // Initialize Monaco\n    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });\n    require(['vs/editor/editor.main'], async () => {\n        if (_isFileDiff) {\n            if (!leftPath || !rightPath) return;\n            try {\n                const [lRes, rRes] = await Promise.all([\n                    fetch(`/api/local/get-hex?path=${encodeURIComponent(leftPath)}&size=${pageSize}`),\n                    fetch(`/api/local/get-hex?path=${encodeURIComponent(rightPath)}&size=${pageSize}`)\n                ]);\n                const [lData, rData] = await Promise.all([lRes.json(), rRes.json()]);\n                if (lData.error) throw new Error(`Left: ${lData.error}`);\n                if (rData.error) throw new Error(`Right: ${rData.error}`);\n                const container = document.getElementById('monacoContainer');\n                diffEditor = monaco.editor.createDiffEditor(container, {\n                    theme: 'vs',\n                    automaticLayout: true,\n                    readOnly: true,\n                    renderSideBySide: true,\n                    fontFamily: \"'VT323', monospace\",\n                    fontSize: 18,\n                    lineHeight: 20,\n                });\n                diffEditor.setModel({\n                    original: monaco.editor.createModel(lData.lines || '', 'plaintext'),\n                    modified: monaco.editor.createModel(rData.lines || '', 'plaintext')\n                });\n                document.getElementById('onlyDiffsBtn').style.display = 'inline-block';\n            } catch (e) {\n                document.getElementById('monacoContainer').innerHTML = `<div style=\"padding:16px;color:#f85149;\">Error: ${e.message}<\/div>`;\n            }\n            return;\n        }\n\n        editor = monaco.editor.create(document.getElementById('monacoContainer'), {\n            value: \"Use Open File... (or drop a file here) to begin.\",\n            language: 'plaintext',\n            theme: 'vs',\n            automaticLayout: true,\n            readOnly: true,\n            fontFamily: \"'VT323', monospace\",\n            fontSize: 18,\n            lineHeight: 20,\n            scrollBeyondLastLine: false,\n            minimap: { enabled: true }\n        });\n\n        if (filePath && _isDiff) {\n            loadHexPage(1);\n            loadStrings();\n        }\n    });\n\n\tfunction downloadCurrentFile() {\n        if (!filePath || false) {\n            alert(\"Cannot download: Missing file path.\");\n            return;\n        }\n\n        // Extract just the filename from the path to suggest to the browser\n        const fileName = filePath.split(/[\\\\/]/).pop() || 'downloaded_file';\n        \n        const url = `${apiBase}/download-file?path=${encodeURIComponent(filePath)}`;\n        \n        PE.download(url, fileName);\n    }\n\n    async function loadHexPage(page) {\n        if (page < 1) page = 1;\n        \n        document.getElementById('pageInput').value = page;\n\n        try {\n            // Pass size explicitly to backend\n            const url = `${apiBase}/get-hex?path=${encodeURIComponent(filePath)}&page=${page}&size=${pageSize}`;\n            const res = await fetch(url);\n            const data = await res.json();\n\n            if (data.error) {\n                editor.setValue(data.error);\n                return;\n            }\n\n            currentPage = data.page;\n            const totalSize = data.total_size;\n            totalPages = Math.ceil(totalSize / pageSize) || 1;\n\n            document.getElementById('pageInput').value = currentPage;\n            document.getElementById('totalPagesLabel').textContent = `of ${totalPages} (${formatBytes(totalSize)})`;\n            \n            const model = editor.getModel();\n            model.setValue(data.lines || \"Empty File\");\n            \n            // Clear previous highlights when page changes\n            currentDecorations = editor.deltaDecorations(currentDecorations, []);\n            editor.setScrollTop(0);\n\n        } catch (err) {\n            console.error(err);\n            editor.setValue(`Error: ${err.message}`);\n        }\n    }\n\n    async function jumpToOffset(globalOffsetStr, stringLength) {\n        const globalOffset = parseInt(globalOffsetStr, 16);\n        if (isNaN(globalOffset)) return;\n\n        // 1. Calculate Page\n        // \"pageSize\" is defined globally as 1024 * 1024\n        const targetPage = Math.floor(globalOffset / pageSize) + 1;\n\n        if (targetPage !== currentPage) {\n            await loadHexPage(targetPage);\n        }\n\n        // 2. Calculate Initial Position on Page\n        let localOffset = globalOffset % pageSize;\n        let remainingBytes = stringLength;\n        const newDecorations = [];\n        \n        // Calculate start line for scrolling\n        const startLineNumber = Math.floor(localOffset / 16) + 1;\n\n        // 3. Loop to generate multi-line highlights\n        while (remainingBytes > 0) {\n            // Where are we currently?\n            const currentLine = Math.floor(localOffset / 16) + 1;\n            const byteIndexInLine = localOffset % 16;\n            \n            // How many bytes are left in this specific line?\n            const bytesAvailableInLine = 16 - byteIndexInLine;\n            \n            // How many bytes can we highlight on THIS line?\n            const bytesToHighlight = Math.min(remainingBytes, bytesAvailableInLine);\n            \n            // Calculate visual columns\n            // 11 chars prefix + (3 chars per byte)\n            const startColumn = 11 + (byteIndexInLine * 3);\n            const endColumn = startColumn + (bytesToHighlight * 3); // Exclusive end for range? Monaco uses inclusive/exclusive depending on context, usually better to point to last char index. \n            // Note: Monaco ranges are [startLine, startCol, endLine, endCol]. \n            // If endCol is inclusive of the character width, we usually subtract 1 or set it to start of next.\n            // Let's use exact char count: start + (N * 3).\n            \n            newDecorations.push({\n                range: new monaco.Range(currentLine, startColumn, currentLine, endColumn),\n                options: { inlineClassName: 'hex-highlight' }\n            });\n\n            // Advance counters\n            remainingBytes -= bytesToHighlight;\n            localOffset += bytesToHighlight;\n        }\n        \n        // Add a full-line background for the primary line\n        newDecorations.push({\n            range: new monaco.Range(startLineNumber, 1, startLineNumber, 1),\n            options: { isWholeLine: true, className: 'line-highlight' }\n        });\n\n        // 4. Apply Decorations\n        currentDecorations = editor.deltaDecorations(currentDecorations, newDecorations);\n\n        // 5. Scroll to the start\n        editor.revealLineInCenter(startLineNumber);\n        editor.setPosition({ lineNumber: startLineNumber, column: 1 });\n    }\n\n    // --- Strings Logic ---\n    async function loadStrings() {\n        const body = document.getElementById('stringsBody');\n        const countEl = document.getElementById('stringsCount');\n        \n        body.innerHTML = '<div style=\"padding:12px;color:var(--text-secondary);\">Scanning strings...<\/div>';\n        \n        try {\n            const res = await fetch(`${apiBase}/get-strings?path=${encodeURIComponent(filePath)}`);\n            const data = await res.json();\n            \n            if (data.error) throw new Error(data.error);\n            \n            body.innerHTML = '';\n            countEl.textContent = `Strings found: ${data.strings.length}`;\n            \n            const fragment = document.createDocumentFragment();\n            data.strings.forEach(s => {\n                const div = document.createElement('div');\n                div.className = 'str-item';\n                div.innerHTML = `\n                    <span class=\"str-offset\">${s.offset_hex}<\/span>\n                    <span class=\"str-type\">${s.type}<\/span>\n                    <span>${escapeHtml(s.string)}<\/span>\n                `;\n                \n                // CLICK HANDLER\n                div.onclick = () => {\n                    // Pass the hex offset and the length of the string\n                    jumpToOffset(s.offset_hex, s.string.length);\n                };\n                fragment.appendChild(div);\n            });\n            body.appendChild(fragment);\n            \n        } catch (e) {\n            body.innerHTML = `<div style=\"padding:12px;color:#da3633;\">Error: ${e.message}<\/div>`;\n        }\n    }\n\n    // --- Helpers (Pagination, HTML Escape, etc) ---\n    function changePage(delta) {\n        let newPage = currentPage + delta;\n        if (newPage < 1) newPage = 1;\n        if (newPage > totalPages) newPage = totalPages;\n        if (newPage !== currentPage) loadHexPage(newPage);\n    }\n\n    function goToPage(val) {\n        let newPage = parseInt(val);\n        if (!isNaN(newPage)) changePage(newPage - currentPage);\n    }\n\n    function formatBytes(bytes) {\n        if (bytes === 0) return '0 B';\n        const k = 1024;\n        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];\n        const i = Math.floor(Math.log(bytes) / Math.log(k));\n        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];\n    }\n    \n    function escapeHtml(text) {\n        return text.replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\");\n    }\n\n    function toggleStringsPanel() {\n        const panel = document.getElementById('stringsPanel');\n        panel.style.display = (panel.style.display === 'none' || !panel.style.display) ? 'flex' : 'none';\n        if (editor) editor.layout();\n    }\n    \n    // Resizer Logic\n    const resizer = document.getElementById('stringsResizer');\n    const panel = document.getElementById('stringsPanel');\n    resizer.addEventListener('mousedown', e => {\n        e.preventDefault();\n        const startY = e.clientY;\n        const startH = panel.offsetHeight;\n        const onMove = e => {\n            panel.style.height = Math.max(60, startH + (startY - e.clientY)) + 'px';\n            if(editor) editor.layout();\n        };\n        const onUp = () => { \n            window.removeEventListener('mousemove', onMove); \n            window.removeEventListener('mouseup', onUp); \n        };\n        window.addEventListener('mousemove', onMove);\n        window.addEventListener('mouseup', onUp);\n    });\n\t\n\t// --- IMPORT SYSTEM LOGIC ---\n\n    \n\n    \n\n    \n\n    function triggerExternalImport() {\n        document.getElementById('externalFileInput').click();\n    }\n\n    document.getElementById('externalFileInput').addEventListener('change', async (e) => {\n        const files = e.target.files;\n        if (!files || files.length === 0) return;\n\n        // Change header text while uploading\n        const pathEl = document.getElementById('viewerTitle');\n        const oldText = pathEl.innerText;\n        pathEl.innerText = \"Uploading File...\";\n\n        const formData = new FormData();\n        \n        for (let i = 0; i < files.length; i++) {\n            formData.append('files[]', files[i]);\n        }\n\n        try {\n            const res = await fetch(`${apiBase}/sqlite/upload-temp`, {\n                method: 'POST',\n                body: formData\n            });\n            const data = await res.json();\n            \n            if (data.status === 'success') {\n                PE.navigate(`view:hex?path=${encodeURIComponent(data.path)}`, window);\n            } else {\n                alert(\"Upload failed: \" + data.error);\n                pathEl.innerText = oldText;\n            }\n        } catch (err) {\n            alert(\"Upload error: \" + err.message);\n            pathEl.innerText = oldText;\n        }\n        \n        e.target.value = ''; \n    });\n<\/script>\n\n\n\n<\/body>\n<\/html>", "text": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Text Viewer<\/title>\n    <script src=\"https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js\"><\/script>\n    <style>\n        :root {\n            --bg: #0d1117;\n            --surface: #161b22;\n            --surface2: #21262d;\n            --text: #e6edf3;\n            --text-secondary: #8b949e;\n            --border: #30363d;\n            --blue: #58a6ff;\n            --red: #da3633;\n        }\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        body {\n            font-family: 'Google Sans', sans-serif;\n            background: var(--bg);\n            color: var(--text);\n            height: 100vh;\n            display: flex;\n            flex-direction: column;\n            overflow: hidden;\n        }\n        header {\n            padding: 8px 16px;\n            background: var(--surface);\n            border-bottom: 1px solid var(--border);\n            display: flex;\n            justify-content: space-between;\n            align-items: center;\n            flex-shrink: 0;\n            height: 50px;\n        }\n        #viewerTitle {\n            font-family: monospace;\n            font-size: 14px;\n            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\n            margin-right: 20px;\n            color: var(--blue);\n        }\n\n        /* PAGINATION CONTROLS */\n        .controls {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n            background: var(--surface2);\n            padding: 4px 8px;\n            border-radius: 6px;\n            border: 1px solid var(--border);\n        }\n        .btn {\n            background: var(--surface);\n            border: 1px solid var(--border);\n            color: var(--blue);\n            padding: 6px 12px;\n            border-radius: 4px;\n            cursor: pointer;\n            font-size: 12px;\n            min-width: 30px;\n        }\n        .btn:hover:not(:disabled) { background: var(--border); }\n        .btn:disabled { opacity: 0.5; cursor: not-allowed; }\n        .active-btn { background: var(--blue) !important; color: #0d1117 !important; border-color: var(--blue) !important; }\n        \n        .page-info {\n            font-size: 12px;\n            font-family: monospace;\n            color: var(--text-secondary);\n            margin: 0 8px;\n        }\n        input.page-input {\n            background: var(--bg);\n            border: 1px solid var(--border);\n            color: var(--text);\n            width: 50px;\n            text-align: center;\n            border-radius: 4px;\n            padding: 2px;\n            font-family: monospace;\n        }\n\n        #monacoContainer { flex: 1; width: 100%; min-height: 0; }\n\n        /* STRINGS PANEL */\n        .bottom-panel {\n            background: var(--surface);\n            border-top: 1px solid var(--border);\n            display: none;\n            flex-direction: column;\n            flex-shrink: 0;\n            position: relative;\n        }\n        .resizer {\n            width: 100%; height: 5px; background: transparent; cursor: ns-resize;\n            position: absolute; top: 0; left: 0; z-index: 10;\n        }\n        .resizer:hover { background: var(--blue); opacity: 0.8; }\n        .panel-header {\n            padding: 0 16px; height: 32px; background: var(--surface2);\n            font-size: 11px; font-weight: 700; text-transform: uppercase;\n            color: var(--text-secondary); display: flex;\n            justify-content: space-between; align-items: center;\n            border-bottom: 1px solid var(--border);\n        }\n        \n        .panel-body { flex: 1; overflow-y: auto; font-family: 'Fira Code', monospace; font-size: 12px; }\n\n        .str-item { padding: 4px 16px; cursor: pointer; border-bottom: 1px solid rgba(48,54,61,0.4); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }\n        .str-item:hover { background: #1f2428; color: var(--blue); }\n        .str-offset { color: var(--text-secondary); margin-right: 12px; font-size: 11px; }\n        .str-type { color: #d2a8ff; border: 1px solid #d2a8ff; padding: 1px 4px; border-radius: 3px; font-size: 10px; margin-right: 8px; }\n\n        .text-highlight {\n            background-color: rgba(255, 255, 0, 0.3);\n            border: 1px solid #d29922;\n        }\n\t\t\n\t\t/* --- Modal Styles --- */\n        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 2000; display: none; align-items: center; justify-content: center; }\n        .modal-window { background: var(--surface); width: 600px; height: 500px; border: 1px solid var(--border); border-radius: 6px; display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }\n        .modal-header { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface2); font-weight: bold; }\n        .modal-body { flex: 1; overflow-y: auto; padding: 10px; }\n        .file-list-item { display: flex; align-items: center; padding: 6px 10px; border-bottom: 1px solid var(--border); cursor: pointer; font-size: 13px; color: var(--text); }\n        .file-list-item:hover { background: var(--surface2); }\n        .file-icon { margin-right: 10px; width: 20px; text-align: center; }\n        .folder-item { color: var(--blue); }\n        .text-item { color: var(--text); }\n        .modal-footer { padding: 10px; border-top: 1px solid var(--border); text-align: right; background: var(--surface); }\n        .breadcrumbs { padding: 5px 15px; background: var(--bg); font-family: monospace; font-size: 12px; color: var(--text-secondary); border-bottom: 1px solid var(--border); }\n    <\/style>\n<style id=\"retro-theme\">\n/* Retro desktop look for the viewers: white panes, grey chrome, 2px black borders, VT323 */\n@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');\n:root {\n  --bg: #ffffff; --surface: #e5e5e5; --surface2: #cccccc; --surface-hover: #f0f0f0;\n  --text: #000000; --text-secondary: #444444; --border: #000000;\n  --blue: #000000; --red: #b00000; --orange: #000000;\n  --key: #000000; --string: #333333; --number: #000000; --bool: #000000; --blob: #666666;\n}\n* { border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }\nhtml, body { font-family: 'VT323', monospace !important; font-size: 18px; background: var(--bg) !important; color: var(--text) !important; }\nbutton, input, select, textarea { font-family: 'VT323', monospace; font-size: 16px; }\nheader { background: var(--surface) !important; border-bottom: 2px solid #000 !important; height: auto !important; min-height: 42px; flex-wrap: wrap; gap: 6px; padding: 4px 10px !important; }\n#viewerTitle { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 18px !important; font-weight: bold; }\n.btn { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; padding: 1px 10px !important; font-size: 16px !important; cursor: pointer; }\n.btn:hover:not(:disabled) { background: #000 !important; color: #fff !important; }\n.btn:disabled { opacity: .45; }\n.active-btn { background: #000 !important; color: #fff !important; border-color: #000 !important; }\n.controls { background: #fff !important; border: 2px solid #000 !important; padding: 2px 6px !important; }\n.page-info { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\ninput.page-input, input[type=text], input[type=number], input[type=search], textarea, select { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.bottom-panel { background: #fff !important; border-top: 2px solid #000 !important; }\n.panel-header { background: var(--surface) !important; color: #000 !important; border-bottom: 2px solid #000 !important; font-size: 14px !important; }\n.panel-body { font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.str-item { border-bottom: 1px solid #999 !important; }\n.str-item:hover { background: #000 !important; color: #fff !important; }\n.str-offset { color: #555 !important; font-size: 14px !important; }\n.str-type { color: #000 !important; border: 1px solid #000 !important; font-size: 12px !important; }\n.resizer:hover { background: #000 !important; }\n.hex-highlight, .text-highlight { background-color: #ffe97a !important; border: 1px solid #000 !important; }\n.line-highlight { background-color: #fff6c2 !important; }\n.modal-overlay { background: rgba(0,0,0,.35) !important; }\n.modal-window { background: #fff !important; border: 2px solid #000 !important; }\n.modal-header, .modal-footer { background: var(--surface) !important; border-color: #000 !important; }\n::-webkit-scrollbar { width: 14px; height: 14px; } ::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }\n::-webkit-scrollbar-thumb { background: #ccc; border: 2px solid #000; }\n::selection { background: #000; color: #fff; }\n.drop-hint { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.85); border: 4px dashed #000; font-size: 28px; z-index: 5000; pointer-events: none; }\n.file-path { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 18px !important; font-weight: bold; }\n.viewer-body { background-color: #fff !important; background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%) !important; background-size: 20px 20px !important; background-position: 0 0,0 10px,10px -10px,-10px 0 !important; }\n.sep { background: #000 !important; }\n.zoom-label { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.btn-active { background: #000 !important; color: #fff !important; border-color: #000 !important; }\nimg#mainImage, img#ktxImage, video { border: 2px solid #000 !important; }\n.error { color: #b00000 !important; }\n.loading { color: #000 !important; }\n.badge, .badge-heic, .badge-live { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; }\n#loadingOverlay { background: rgba(255,255,255,.92) !important; }\n\n<\/style>\n<\/head>\n<body>\n<header>\n    <span id=\"viewerTitle\">Loading...<\/span>\n    \n\t<div style=\"display: flex; gap: 10px; align-items: center;\">\n        <button class=\"btn\" onclick=\"triggerExternalImport()\">Open File...<\/button>\n        <input type=\"file\" id=\"externalFileInput\" multiple style=\"display: none;\" accept=\"*\">\n    <\/div>\n\t\n    <div class=\"controls\">\n        <button class=\"btn\" onclick=\"changePage(-10000)\">|&lt;<\/button>\n        <button class=\"btn\" onclick=\"changePage(-1)\">&lt;<\/button>\n        \n        <span class=\"page-info\">Page<\/span>\n        <input type=\"text\" id=\"pageInput\" class=\"page-input\" value=\"1\" onkeydown=\"if(event.key==='Enter') goToPage(this.value)\">\n        <span class=\"page-info\" id=\"totalPagesLabel\">of ?<\/span>\n        \n        <button class=\"btn\" onclick=\"changePage(1)\">&gt;<\/button>\n        <button class=\"btn\" onclick=\"changePage(10000)\">&gt;|<\/button>\n    <\/div>\n\n    <div style=\"display: flex; gap: 8px; margin-left: 10px;\">\n        <button id=\"onlyDiffsBtn\" class=\"btn\" style=\"display: none;\" onclick=\"toggleOnlyDiffs()\">Only Diffs<\/button>\n        <button class=\"btn\" onclick=\"toggleStringsPanel()\">Strings<\/button>\n        <button class=\"btn\" onclick=\"downloadCurrentFile()\">Download<\/button>\n    <\/div>\n<\/header>\n\n<div id=\"monacoContainer\"><\/div>\n\n<div id=\"stringsPanel\" class=\"bottom-panel\" style=\"height: 180px; display: none;\">\n    <div id=\"stringsResizer\" class=\"resizer\"><\/div>\n    <div class=\"panel-header\">\n        <span id=\"stringsCount\">Strings found: 0<\/span>\n        <span onclick=\"toggleStringsPanel()\" style=\"cursor:pointer;\">\u00d7<\/span>\n    <\/div>\n    <div id=\"stringsBody\" class=\"panel-body\"><\/div>\n<\/div>\n\n<script>\n    let editor = null;\n    let diffEditor = null;\n    let currentPage = 1;\n    let totalPages = 1;\n    let _onlyDiffsActive = false;\n\n    function toggleOnlyDiffs() {\n        _onlyDiffsActive = !_onlyDiffsActive;\n        document.getElementById('onlyDiffsBtn').classList.toggle('active-btn', _onlyDiffsActive);\n        if (diffEditor) diffEditor.updateOptions({ hideUnchangedRegions: { enabled: _onlyDiffsActive } });\n    }\n\n    // CONFIGURATION: 1MB Page Size\n    const pageSize = 1024 * 1024;\n\n    let currentDecorations = [];\n    const params = new URLSearchParams(window.PE_SEARCH);\n    const source      = params.get('source');\n    const _isFileDiff = source === 'filediff';\n    const _isDiff = !_isFileDiff;\n    const filePath = params.get('path');\n    const apiBase = '/api/local';\n\n    const leftPath  = _isFileDiff ? params.get('left')  : null;\n    const rightPath = _isFileDiff ? params.get('right') : null;\n\n    if (_isFileDiff) {\n        const lName = (leftPath  || '').split(/[\\\\/]/).pop();\n        const rName = (rightPath || '').split(/[\\\\/]/).pop();\n        document.getElementById('viewerTitle').textContent = `Diff: ${lName} vs ${rName}`;\n    } else {\n        document.getElementById('viewerTitle').textContent = filePath || 'No file open';\n    }\n\n    // Initialize Monaco\n    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });\n    require(['vs/editor/editor.main'], async () => {\n        if (_isFileDiff) {\n            if (!leftPath || !rightPath) return;\n            try {\n                const [lRes, rRes] = await Promise.all([\n                    fetch(`/api/local/get-text?path=${encodeURIComponent(leftPath)}&size=10485760`),\n                    fetch(`/api/local/get-text?path=${encodeURIComponent(rightPath)}&size=10485760`)\n                ]);\n                const [lData, rData] = await Promise.all([lRes.json(), rRes.json()]);\n                if (lData.error) throw new Error(`Left: ${lData.error}`);\n                if (rData.error) throw new Error(`Right: ${rData.error}`);\n                const container = document.getElementById('monacoContainer');\n                diffEditor = monaco.editor.createDiffEditor(container, {\n                    theme: 'vs',\n                    automaticLayout: true,\n                    readOnly: true,\n                    renderSideBySide: true,\n                    fontFamily: \"'VT323', monospace\",\n                    fontSize: 18,\n                    lineHeight: 20,\n                });\n                diffEditor.setModel({\n                    original: monaco.editor.createModel(lData.content || '', 'plaintext'),\n                    modified: monaco.editor.createModel(rData.content || '', 'plaintext')\n                });\n                document.getElementById('onlyDiffsBtn').style.display = 'inline-block';\n            } catch (e) {\n                document.getElementById('monacoContainer').innerHTML = `<div style=\"padding:16px;color:#f85149;\">Error: ${e.message}<\/div>`;\n            }\n            return;\n        }\n\n        editor = monaco.editor.create(document.getElementById('monacoContainer'), {\n            value: \"Use Open File... (or drop a file here) to begin.\",\n            language: 'plaintext',\n            theme: 'vs',\n            automaticLayout: true,\n            readOnly: true,\n            fontFamily: \"'VT323', monospace\",\n            fontSize: 18,\n            lineHeight: 20,\n            wordWrap: 'off', // Off to make line numbers match specific lines easier\n            scrollBeyondLastLine: false,\n            minimap: { enabled: true }\n        });\n\n        if (filePath && _isDiff) {\n            loadTextPage(1);\n            loadStrings();\n        }\n    });\n\n\tfunction downloadCurrentFile() {\n        if (!filePath || false) {\n            alert(\"Cannot download: Missing file path.\");\n            return;\n        }\n\n        // Extract just the filename from the path to suggest to the browser\n        const fileName = filePath.split(/[\\\\/]/).pop() || 'downloaded_file';\n        \n        const url = `${apiBase}/download-file?path=${encodeURIComponent(filePath)}`;\n        \n        PE.download(url, fileName);\n    }\n\n    async function loadTextPage(page) {\n        if (page < 1) page = 1;\n        document.getElementById('pageInput').value = page;\n\n        try {\n            const url = `${apiBase}/get-text?path=${encodeURIComponent(filePath)}&page=${page}&size=${pageSize}`;\n            const res = await fetch(url);\n            const data = await res.json();\n\n            if (data.error) {\n                editor.setValue(data.error);\n                return;\n            }\n\n            currentPage = data.page;\n            const totalSize = data.total_size;\n            totalPages = Math.ceil(totalSize / pageSize) || 1;\n\n            document.getElementById('pageInput').value = currentPage;\n            document.getElementById('totalPagesLabel').textContent = `of ${totalPages} (${formatBytes(totalSize)})`;\n            \n            const model = editor.getModel();\n            model.setValue(data.content || \"Empty File\");\n            \n            // Reset highlights\n            currentDecorations = editor.deltaDecorations(currentDecorations, []);\n            editor.setScrollTop(0);\n\n        } catch (err) {\n            console.error(err);\n            editor.setValue(`Error: ${err.message}`);\n        }\n    }\n\n    // --- STRINGS LOGIC ---\n    async function loadStrings() {\n        const body = document.getElementById('stringsBody');\n        const countEl = document.getElementById('stringsCount');\n        \n        body.innerHTML = '<div style=\"padding:12px;color:var(--text-secondary);\">Scanning strings...<\/div>';\n        \n        try {\n            const res = await fetch(`${apiBase}/get-strings?path=${encodeURIComponent(filePath)}`);\n            const data = await res.json();\n            \n            if (data.error) throw new Error(data.error);\n            \n            body.innerHTML = '';\n            countEl.textContent = `Strings found: ${data.strings.length}`;\n            \n            const fragment = document.createDocumentFragment();\n            data.strings.forEach(s => {\n                const div = document.createElement('div');\n                div.className = 'str-item';\n                div.innerHTML = `\n                    <span class=\"str-offset\">${s.offset_hex}<\/span>\n                    <span class=\"str-type\">${s.type}<\/span>\n                    <span>${escapeHtml(s.string)}<\/span>\n                `;\n                \n                // CLICK HANDLER\n                div.onclick = () => {\n                    jumpToString(s.string, s.offset_hex);\n                };\n                fragment.appendChild(div);\n            });\n            body.appendChild(fragment);\n            \n        } catch (e) {\n            body.innerHTML = `<div style=\"padding:12px;color:#da3633;\">Error: ${e.message}<\/div>`;\n        }\n    }\n\n    async function jumpToString(searchString, globalOffsetStr) {\n        const globalOffset = parseInt(globalOffsetStr, 16);\n        if (isNaN(globalOffset)) return;\n\n        // 1. Calculate Page\n        const targetPage = Math.floor(globalOffset / pageSize) + 1;\n\n        // 2. Load Page if needed\n        if (targetPage !== currentPage) {\n            await loadTextPage(targetPage);\n        }\n\n        // 3. Find string in editor\n        const model = editor.getModel();\n        const matches = model.findMatches(searchString, false, false, true, null, true);\n        \n        // Simple Heuristic: If we have matches, highlight the first one \n        // (Since text view might change byte offsets slightly due to encoding, exact byte offset match is hard.\n        // Finding the exact string content is usually \"good enough\" for text view)\n        \n        if (matches.length > 0) {\n            const match = matches[0]; // Take the first match\n            \n            currentDecorations = editor.deltaDecorations(currentDecorations, [{\n                range: match.range,\n                options: { \n                    inlineClassName: 'text-highlight',\n                    isWholeLine: false \n                }\n            }]);\n            \n            editor.revealRangeInCenter(match.range);\n        } else {\n            alert(\"String found in file but not visible on current text page (Encoding difference?)\");\n        }\n    }\n\n    // --- HELPERS ---\n    function changePage(delta) {\n        let newPage = currentPage + delta;\n        if (newPage < 1) newPage = 1;\n        if (newPage > totalPages) newPage = totalPages;\n        if (newPage !== currentPage) loadTextPage(newPage);\n    }\n\n    function goToPage(val) {\n        let newPage = parseInt(val);\n        if (!isNaN(newPage)) changePage(newPage - currentPage);\n    }\n\n    function formatBytes(bytes) {\n        if (bytes === 0) return '0 B';\n        const k = 1024;\n        const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];\n        const i = Math.floor(Math.log(bytes) / Math.log(k));\n        return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];\n    }\n    \n    function escapeHtml(text) {\n        return text.replace(/&/g, \"&amp;\").replace(/<\/g, \"&lt;\").replace(/>/g, \"&gt;\");\n    }\n\n    function toggleStringsPanel() {\n        const panel = document.getElementById('stringsPanel');\n        panel.style.display = (panel.style.display === 'none' || !panel.style.display) ? 'flex' : 'none';\n        if (editor) editor.layout();\n    }\n    \n    // Resizer Logic\n    const resizer = document.getElementById('stringsResizer');\n    const panel = document.getElementById('stringsPanel');\n    resizer.addEventListener('mousedown', e => {\n        e.preventDefault();\n        const startY = e.clientY;\n        const startH = panel.offsetHeight;\n        const onMove = e => {\n            panel.style.height = Math.max(60, startH + (startY - e.clientY)) + 'px';\n            if(editor) editor.layout();\n        };\n        const onUp = () => { \n            window.removeEventListener('mousemove', onMove); \n            window.removeEventListener('mouseup', onUp); \n        };\n        window.addEventListener('mousemove', onMove);\n        window.addEventListener('mouseup', onUp);\n    });\n\t\n\t// --- IMPORT SYSTEM LOGIC ---\n\n    \n\n    \n\n    \n\n    function triggerExternalImport() {\n        document.getElementById('externalFileInput').click();\n    }\n\n    document.getElementById('externalFileInput').addEventListener('change', async (e) => {\n        const files = e.target.files;\n        if (!files || files.length === 0) return;\n\n\n        const formData = new FormData();\n        \n        for (let i = 0; i < files.length; i++) {\n            formData.append('files[]', files[i]);\n        }\n\n        try {\n            const res = await fetch(`${apiBase}/sqlite/upload-temp`, {\n                method: 'POST',\n                body: formData\n            });\n            const data = await res.json();\n            \n            if (data.status === 'success') {\n                PE.navigate(`view:text?path=${encodeURIComponent(data.path)}`, window);\n            } else {\n                alert(\"Upload failed: \" + data.error);\n            }\n        } catch (err) {\n            alert(\"Upload error: \" + err.message);\n        }\n        \n        e.target.value = ''; \n    });\n<\/script>\n\n\n\n<\/body>\n<\/html>", "image": "<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <title>Image Viewer<\/title>\n    <style>\n        :root {\n            --bg: #0d1117;\n            --surface: #161b22;\n            --surface2: #21262d;\n            --text: #e6edf3;\n            --text-secondary: #8b949e;\n            --border: #30363d;\n            --blue: #58a6ff;\n            --orange: #d29922;\n        }\n        * { margin: 0; padding: 0; box-sizing: border-box; }\n        body {\n            font-family: 'Segoe UI', sans-serif;\n            background: var(--bg);\n            color: var(--text);\n            height: 100vh;\n            display: flex;\n            flex-direction: column;\n            overflow: hidden;\n        }\n        header {\n            padding: 8px 16px;\n            background: var(--surface);\n            border-bottom: 1px solid var(--border);\n            display: flex;\n            align-items: center;\n            height: 50px;\n            flex-shrink: 0;\n            justify-content: space-between;\n        }\n        .file-path {\n            font-family: monospace;\n            font-size: 14px;\n            color: var(--blue);\n            white-space: nowrap;\n            overflow: hidden;\n            text-overflow: ellipsis;\n            margin-right: 20px;\n        }\n        .controls {\n            display: flex;\n            align-items: center;\n            gap: 8px;\n        }\n        .btn {\n            background: var(--surface2);\n            border: 1px solid var(--border);\n            color: var(--text);\n            padding: 4px 12px;\n            border-radius: 4px;\n            cursor: nt; color: #fff !important; border-color: #000 !important; }\nimg#mainImage, img#ktxImage, video { border: 2px solid #000 !important; }\n.error { color: #b00000 !important; }\n.loading { color: #000 !important; }\n.badge, .badge-heic, .badge-live { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; }\n#loadingOverlay { background: rgba(255,255,255,.92) !important; }\n\n<\/style>\n<\/head>\n<body>\n\n<header>\n    <div style=\"display:flex; align-items:center;\">\n        <div class=\"file-path\" id=\"filePath\">Loading...<\/div>\n        <span class=\"badge badge-heic\" id=\"badgeHeic\" style=\"display:none;\">HEIC<\/span>\n        <span class=\"badge badge-live\" id=\"badgeLive\" style=\"display:none;\">LIVE<\/span>\n    <\/div>\n    <div class=\"controls\">\n        <button class=\"btn\" onclick=\"triggerExternalImport()\">Open File...<\/button>\n        <input type=\"file\" id=\"externalFileInput\" multiple style=\"display: none;\" accept=\"image/*,.heic,.heif\">\n\n        <div class=\"sep\"><\/div>\n\n        <!-- Live Photo Toggle (hidden unless file is a live photo) -->\n        <button class=\"btn\" id=\"btnToggleLive\" style=\"display:none;\" onclick=\"toggleLiveVideo()\">Play Live Photo<\/button>\n\n        <div class=\"sep\"><\/div>\n\n        <button class=\"btn\" onclick=\"downloadCurrentFile()\">Download<\/button>\n        <button class=\"btn\" onclick=\"location.reload()\">Refresh<\/button>\n        <button class=\"btn\" onclick=\"PE.closeViewer(window)\">Close<\/button>\n    <\/div>\n<\/header>\n\n<div class=\"viewer-body\">\n    <div id=\"statusMsg\" class=\"error\" style=\"display:none;\">Error loading image<\/div>\n    <img id=\"mainImage\" alt=\"Image\">\n    <video id=\"liveVideo\" controls loop><\/video>\n<\/div>\n\n<script>\n    const params = new URLSearchParams(window.PE_SEARCH);\n    const source = params.get('source');\n    const _isDiff = true;\n    const relPath = params.get('path');\n    const fileType = params.get('type') || 'png';   // 'png' or 'heic'\n    const isLive  = params.get('live') === '1';\n    const apiBase = '/api/local';\n\n    const img = document.getElementById('mainImage');\n    const video = document.getElementById('liveVideo');\n    const status = document.getElementById('statusMsg');\n    const zoomLabel = document.getElementById('zoomLabel');\n    const btnToggle = document.getElementById('btnToggleLive');\n\n    let currentScale = 1.0;\n    let isFitMode = true;\n    let showingVideo = false;\n\n    document.getElementById('filePath').textContent = relPath || \"No file open\";\n\n    // Show badges\n    if (fileType === 'heic') {\n        document.getElementById('badgeHeic').style.display = 'inline';\n    }\n    if (isLive) {\n        document.getElementById('badgeLive').style.display = 'inline';\n        btnToggle.style.display = 'flex';\n    }\n\n    // Determine the correct image endpoint\n    let imageEndpoint;\n    if (fileType === 'heic') {\n        imageEndpoint = `${apiBase}/get-heic-image?path=${encodeURIComponent(relPath)}`;\n    } else {\n        imageEndpoint = `${apiBase}/get-png-image?path=${encodeURIComponent(relPath)}`;\n    }\n\n    if (relPath && _isDiff) {\n        PE.blobUrl(imageEndpoint).then(function (u) { img.src = u; }, function () { if (img.onerror) img.onerror(); });\n\n        img.onload = function() {\n            img.style.display = 'block';\n            status.style.display = 'none';\n            resetToFit();\n        };\n\n        img.onerror = function() {\n            status.style.display = 'block';\n            status.textContent = fileType === 'heic'\n                ? \"Error: Failed to load HEIC image. Conversion may have failed.\"\n                : \"Error: Failed to load PNG image.\";\n        };\n    }\n\n    function toggleLiveVideo() {\n        showingVideo = !showingVideo;\n        if (showingVideo) {\n            img.style.display = 'none';\n            video.style.display = 'block';\n

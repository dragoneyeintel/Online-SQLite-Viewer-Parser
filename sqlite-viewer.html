: var(--text); }\n        .file-list-item:hover { background: var(--surface2); }\n        .file-icon { margin-right: 10px; width: 20px; text-align: center; }\n        .folder-item { color: var(--blue); }\n        .video-item { color: #d29922; } /* Orange accent for videos */\n        .modal-footer { padding: 10px; border-top: 1px solid var(--border); text-align: right; background: var(--surface); }\n        .breadcrumbs { padding: 5px 15px; background: var(--bg); font-family: monospace; font-size: 12px; color: #8b949e; border-bottom: 1px solid var(--border); }\n    <\/style>\n<style id=\"retro-theme\">\n/* Retro desktop look for the viewers: white panes, grey chrome, 2px black borders, VT323 */\n@import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');\n:root {\n  --bg: #ffffff; --surface: #e5e5e5; --surface2: #cccccc; --surface-hover: #f0f0f0;\n  --text: #000000; --text-secondary: #444444; --border: #000000;\n  --blue: #000000; --red: #b00000; --orange: #000000;\n  --key: #000000; --string: #333333; --number: #000000; --bool: #000000; --blob: #666666;\n}\n* { border-radius: 0 !important; box-shadow: none !important; text-shadow: none !important; }\nhtml, body { font-family: 'VT323', monospace !important; font-size: 18px; background: var(--bg) !important; color: var(--text) !important; }\nbutton, input, select, textarea { font-family: 'VT323', monospace; font-size: 16px; }\nheader { background: var(--surface) !important; border-bottom: 2px solid #000 !important; height: auto !important; min-height: 42px; flex-wrap: wrap; gap: 6px; padding: 4px 10px !important; }\n#viewerTitle { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 18px !important; font-weight: bold; }\n.btn { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; padding: 1px 10px !important; font-size: 16px !important; cursor: pointer; }\n.btn:hover:not(:disabled) { background: #000 !important; color: #fff !important; }\n.btn:disabled { opacity: .45; }\n.active-btn { background: #000 !important; color: #fff !important; border-color: #000 !important; }\n.controls { background: #fff !important; border: 2px solid #000 !important; padding: 2px 6px !important; }\n.page-info { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\ninput.page-input, input[type=text], input[type=number], input[type=search], textarea, select { background: #fff !important; color: #000 !important; border: 2px solid #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.bottom-panel { background: #fff !important; border-top: 2px solid #000 !important; }\n.panel-header { background: var(--surface) !important; color: #000 !important; border-bottom: 2px solid #000 !important; font-size: 14px !important; }\n.panel-body { font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.str-item { border-bottom: 1px solid #999 !important; }\n.str-item:hover { background: #000 !important; color: #fff !important; }\n.str-offset { color: #555 !important; font-size: 14px !important; }\n.str-type { color: #000 !important; border: 1px solid #000 !important; font-size: 12px !important; }\n.resizer:hover { background: #000 !important; }\n.hex-highlight, .text-highlight { background-color: #ffe97a !important; border: 1px solid #000 !important; }\n.line-highlight { background-color: #fff6c2 !important; }\n.modal-overlay { background: rgba(0,0,0,.35) !important; }\n.modal-window { background: #fff !important; border: 2px solid #000 !important; }\n.modal-header, .modal-footer { background: var(--surface) !important; border-color: #000 !important; }\n::-webkit-scrollbar { width: 14px; height: 14px; } ::-webkit-scrollbar-track { background: #fff; border-left: 2px solid #000; }\n::-webkit-scrollbar-thumb { background: #ccc; border: 2px solid #000; }\n::selection { background: #000; color: #fff; }\n.drop-hint { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.85); border: 4px dashed #000; font-size: 28px; z-index: 5000; pointer-events: none; }\n.file-path { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 18px !important; font-weight: bold; }\n.viewer-body { background-color: #fff !important; background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%) !important; background-size: 20px 20px !important; background-position: 0 0,0 10px,10px -10px,-10px 0 !important; }\n.sep { background: #000 !important; }\n.zoom-label { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.btn-active { background: #000 !important; color: #fff !important; border-color: #000 !important; }\nimg#mainImage, img#ktxImage, video { border: 2px solid #000 !important; }\n.error { color: #b00000 !important; }\n.loading { color: #000 !important; }\n.badge, .badge-heic, .badge-live { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; }\n#loadingOverlay { background: rgba(255,255,255,.92) !important; }\n\n<\/style>\n<\/head>\n<body>\n\n<header>\n    <div class=\"file-path\" id=\"filePath\">Loading...<\/div>\n    <div class=\"controls\">\n        <button class=\"btn\" onclick=\"triggerExternalImport()\">Open File...<\/button>\n        <input type=\"file\" id=\"externalFileInput\" multiple style=\"display: none;\" accept=\"video/*\">\n        \n        <div style=\"width: 1px; height: 20px; background: var(--border); margin: 0 4px;\"><\/div>\n        <button class=\"btn\" onclick=\"downloadCurrentFile()\">Download<\/button>\n        <button class=\"btn\" onclick=\"location.reload()\">Refresh<\/button>\n        <button class=\"btn\" onclick=\"PE.closeViewer(window)\">Close<\/button>\n    <\/div>\n<\/header>\n\n<div id=\"loadingOverlay\" style=\"display:none; position:absolute; top:50px; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); z-index:10; flex-direction:column; align-items:center; justify-content:center;\">\n    <div style=\"border: 4px solid var(--surface2); border-top: 4px solid var(--blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;\"><\/div>\n    <div style=\"margin-top: 15px; color:var(--text-secondary); font-weight: 600;\">Loading video...<\/div>\n    <div style=\"font-size: 11px; color:var(--text-secondary); margin-top: 5px;\"><\/div>\n<\/div>\n<style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }<\/style>\n\n<div class=\"viewer-body\">\n    <video id=\"videoPlayer\" controls autoplay loop><\/video>\n<\/div>\n\n<script>\n    const params = new URLSearchParams(window.PE_SEARCH);\n    const source = params.get('source');\n    const _isDiff = true;\n    const relPath = params.get('path');\n    const apiBase = '/api/local';\n\n    const video = document.getElementById('videoPlayer');\n    const overlay = document.getElementById('loadingOverlay');\n    let hasAttemptedTranscode = false;\n    let activeStreamUrl = \"\";\n\n    document.getElementById('filePath').textContent = relPath || \"No file open\";\n\n    if (relPath && _isDiff) {\n        // In diff mode serve-file streams the raw video directly\n        activeStreamUrl = _isDiff\n            ? `/api/local/serve-file?path=${encodeURIComponent(relPath)}`\n            : `${apiBase}/download-file?path=${encodeURIComponent(relPath)}&inline=true`;\n        PE.blobUrl(activeStreamUrl).then(function (u) { video.src = u; });\n    }\n\n    // FALLBACK LOGIC\n    video.onerror = function() {\n        overlay.style.display = 'flex'; video.style.display = 'none';\n        showErrorLog('This browser cannot play this video format. Try another browser, or download the file and open it in a video player.');\n    };\n\n\tfunction downloadCurrentFile() {\n        if (!relPath) { alert('No file loaded.'); return; }\n        let fileName = relPath.split(/[\\/]/).pop() || 'video.mp4'; \n        PE.download(`${apiBase}/download-file?path=${encodeURIComponent(relPath)}`, fileName);\n    }\n\n    function showErrorLog(logText) {\n        overlay.innerHTML = `\n            <div style=\"color:var(--red); font-weight:bold; margin-bottom: 10px; font-size: 16px;\">Failed to decode or transcode video.<\/div>\n            <button class=\"btn\" style=\"margin-bottom: 10px;\" onclick=\"document.getElementById('errorLog').style.display='block'\">More<\/button>\n            <textarea id=\"errorLog\" style=\"display:none; width: 80%; height: 200px; background: #000; color: #ff5555; border: 1px solid var(--border); font-family: monospace; font-size: 11px; padding: 10px; border-radius: 6px; outline: none;\" readonly><\/textarea>\n        `;\n        document.getElementById('errorLog').value = logText;\n    }\n\n    video.onloadeddata = function() {\n        overlay.style.display = 'none';\n        video.style.display = 'block';\n        video.play().catch(e => console.warn(\"Autoplay blocked by browser\", e));\n    };\n\n    \n\t\n\t// --- IMPORT SYSTEM LOGIC ---\n\n    \n\n    \n\n    \n\n    function triggerExternalImport() {\n        document.getElementById('externalFileInput').click();\n    }\n\n    document.getElementById('externalFileInput').addEventListener('change', async (e) => {\n        const files = e.target.files;\n        if (!files || files.length === 0) return;\n\n        // Change header text while uploading\n        const pathEl = document.getElementById('filePath');\n        const oldText = pathEl.innerText;\n        pathEl.innerText = \"Uploading Video...\";\n\n        const formData = new FormData();\n        \n        for (let i = 0; i < files.length; i++) {\n            formData.append('files[]', files[i]);\n        }\n\n        try {\n            const res = await fetch(`${apiBase}/sqlite/upload-temp`, {\n                method: 'POST',\n                body: formData\n            });\n            const data = await res.json();\n            \n            if (data.status === 'success') {\n                PE.navigate(`view:mp4?path=${encodeURIComponent(data.path)}`, window);\n            } else {\n                alert(\"Upload failed: \" + data.error);\n                pathEl.innerText = oldText;\n            }\n        } catch (err) {\n            alert(\"Upload error: \" + err.message);\n            pathEl.innerText = oldText;\n        }\n        \n        e.target.value = ''; \n    });\n<\/script>\n\n\n\n<\/body>\n<\/html>"};
</script>
<script>

(function () {
'use strict';
let cur = "sqlite";
const VIEWERS = window.__VIEWERS__, TITLES = {"ktx": "KTX Viewer", "biome": "Biome (SEGB) Viewer", "plist": "Plist Viewer", "sqlite": "SQLite Viewer", "hex": "HEX Viewer", "text": "Text Viewer", "image": "Image Viewer", "mp4": "MP4 Viewer"};
const frame = document.getElementById('fv');
const norm = k => (k === 'segb' ? 'biome' : k);
function parse(url) { const m = /^view:(\w+)(?:\?(.*))?$/.exec(url || ''); return m ? { kind: norm(m[1]), search: '?' + (m[2] || '') } : null; }

const MAP = { png: 'image', image: 'image', heic: 'image', ktx: 'ktx', video: 'mp4', sqlite: 'sqlite', segb: 'biome', plist: 'plist', text: 'text' };
// Pick the right viewer from the file's own bytes; hex and text are explicit choices and are kept as asked.
function route(kind, search) {
  if (kind === 'hex' || kind === 'text') return load(kind, search);
  const q = new URLSearchParams((search || '').replace(/^\?/, '')); const rec = PE.vfs.get(q.get('path') || '');
  if (rec) {
    const det = PE.detectMagic(rec.bytes.subarray(0, 256)); const want = MAP[det] || 'hex';
    if (want !== kind) { if (det === 'heic') q.set('type', 'heic'); return load(want, '?' + q.toString()); }
  }
  load(kind, search);
}
function load(kind, search) {
  if (!VIEWERS[kind]) { alert('The ' + kind + ' viewer is not part of this build.'); return; }
  cur = kind; document.title = TITLES[kind] || document.title;
  const boot = '<script>window.PE=parent.PE;window.PE_SEARCH=' + JSON.stringify(search || '') +
    ';PE.installFetch(window);PE.bootViewer(window);<\/script>';
  frame.srcdoc = VIEWERS[kind].replace(/<head>/i, '<head>' + boot);
}

PE.bootViewer = function (w) {
  w.open = function (url) { return PE.open(url, w); };
  w.addEventListener('DOMContentLoaded', function () {
    const hint = w.document.createElement('div'); hint.className = 'drop-hint'; hint.textContent = 'Drop file to open'; w.document.body.appendChild(hint);
    let depth = 0;
    w.document.addEventListener('dragenter', e => { e.preventDefault(); depth++; hint.style.display = 'flex'; });
    w.document.addEventListener('dragleave', () => { depth = Math.max(0, depth - 1); if (!depth) hint.style.display = 'none'; });
    w.document.addEventListener('dragover', e => e.preventDefault());
    w.document.addEventListener('drop', async e => {
      e.preventDefault(); depth = 0; hint.style.display = 'none';
      const list = [...(e.dataTransfer.files || [])]; if (!list.length) return;
      const path = await PE.uploadFiles(list); route(cur, '?path=' + encodeURIComponent(path));
    });
  });
};
PE.closeViewer = function () { try { window.close(); } catch (e) {} };

// "open in a new window": a copy of this same page in a new tab, file handed over in memory
const pending = new Map();
function selfCopyUrl() {
  const root = document.documentElement.cloneNode(true);
  const f = root.querySelector('#fv'); if (f) f.removeAttribute('srcdoc');
  return URL.createObjectURL(new Blob(['<!DOCTYPE html>\n' + root.outerHTML], { type: 'text/html' }));
}
function openNewTab(kind, search) {
  const w = window.open(selfCopyUrl(), '_blank'); if (!w) return null;
  const p = new URLSearchParams((search || '').replace(/^\?/, ''));
  const rec = PE.vfs.get(p.get('path') || '');
  pending.set(w, { kind: kind, name: rec ? rec.name : null, bytes: rec ? rec.bytes : null, search: search });
  return w;
}
PE.navigate = function (url) { const p = parse(url); if (p) route(p.kind, p.search); };
PE.open = function (url) {
  const p = parse(url);
  if (p) { openNewTab(p.kind, p.search); return { postMessage() {}, closed: false }; }
  return window.open(url, '_blank', 'noopener');
};
window.addEventListener('message', function (e) {
  const d = e.data || {};
  if (d.fv === 'ready' && pending.has(e.source)) {
    const job = pending.get(e.source); pending.delete(e.source);
    e.source.postMessage({ fv: 'file', kind: job.kind, name: job.name, bytes: job.bytes, search: job.search }, '*');
  } else if (d.fv === 'file') {
    let search = d.search || '';
    if (d.bytes) { const q = new URLSearchParams(search.replace(/^\?/, '')); q.set('path', PE.addBytes(d.name, new Uint8Array(d.bytes))); search = '?' + q.toString(); }
    route(d.kind, search);
  }
});
if (window.opener) { try { window.opener.postMessage({ fv: 'ready' }, '*'); } catch (e) {} }

load(cur, '');
})();

</script>

ckground: #000; color: #fff; }\n.drop-hint { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(255,255,255,.85); border: 4px dashed #000; font-size: 28px; z-index: 5000; pointer-events: none; }\n.file-path { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 18px !important; font-weight: bold; }\n.viewer-body { background-color: #fff !important; background-image: linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%) !important; background-size: 20px 20px !important; background-position: 0 0,0 10px,10px -10px,-10px 0 !important; }\n.sep { background: #000 !important; }\n.zoom-label { color: #000 !important; font-family: 'VT323', monospace !important; font-size: 16px !important; }\n.btn-active { background: #000 !important; color: #fff !important; border-color: #000 !important; }\nimg#mainImage, img#ktxImage, video { border: 2px solid #000 !important; }\n.error { color: #b00000 !important; }\n.loading { color: #000 !important; }\n.badge, .badge-heic, .badge-live { border: 1px solid #000 !important; background: #fff !important; color: #000 !important; }\n#loadingOverlay { background: rgba(255,255,255,.92) !important; }\n\n<\/style>\n<\/head>\n<body>\n\n<header>\n    <div style=\"display: flex; gap: 10px; margin-right: auto; align-items: center;\">\n        <div id=\"fileNameDisplay\" style=\"margin-right: 15px; font-weight: 500;\">Loading Biome...<\/div>\n\t\t<button class=\"btn\" onclick=\"triggerExternalImport()\">Open File...<\/button>\n\t\t<input type=\"file\" id=\"externalFileInput\" style=\"display: none;\" accept=\"*\">\n\n\t\t\n\t\t\n\t\t<button class=\"btn\" onclick=\"downloadCurrentFile()\">Download<\/button>\n    <\/div>\n\n    <div class=\"search-container\">\n        <input type=\"text\" id=\"globalSearchInput\" placeholder=\"Search entries...\"\n               style=\"background: transparent; border: none; color: var(--text); font-size: 12px; outline: none; width: 180px;\">\n\n        <span id=\"searchStatus\" style=\"font-size: 11px; color: var(--text-secondary); min-width: 40px; text-align: center;\">0/0<\/span>\n\n        <div class=\"search-nav-group\">\n            <button class=\"search-nav-btn\" onclick=\"navSearch(-1)\">&#9664;<\/button>\n            <button class=\"search-nav-btn\" onclick=\"navSearch(1)\">&#9654;<\/button>\n        <\/div>\n    <\/div>\n\n    <div class=\"tabs\" id=\"modeTabs\"><\/div>\n<\/header>\n\n<div class=\"main-container\">\n    <div class=\"sidebar\">\n        <div class=\"db-info\" id=\"biomeInfo\">\n            <div class=\"info-title\" onclick=\"toggleBiomeInfo()\" style=\"cursor: pointer; display: flex; justify-content: space-between; align-items: center;\">\n                <span>Biome Info<\/span>\n                <span id=\"biomeInfoToggleIcon\" style=\"font-size: 10px;\">&#9660;<\/span>\n            <\/div>\n            <div id=\"biomeInfoContent\">\n\t\t\t\t<div class=\"info-row\"><span>Biome Version:<\/span> <span class=\"info-val\" id=\"valBiomeVersion\">-<\/span><\/div>\n\t\t\t\t<div class=\"info-row\"><span>Store Version:<\/span> <span class=\"info-val\" id=\"valStoreVersion\">-<\/span><\/div>\n\t\t\t\t<div class=\"info-row\"><span>Segment Name:<\/span> <span class=\"info-val\" id=\"valSegmentName\">-<\/span><\/div>\n\t\t\t\t<div class=\"info-row\"><span>Entry Count:<\/span> <span class=\"info-val\" id=\"valEntryCount\">-<\/span><\/div>\n\t\t\t\t<div class=\"info-row\"><span>File Size:<\/span> <span class=\"info-val\" id=\"valFileSize\">-<\/span><\/div>\n\t\t\t\t<div class=\"info-row\"><span>Earliest:<\/span> <span class=\"info-val\" id=\"valEarliest\">-<\/span><\/div>\n\t\t\t\t<div class=\"info-row\"><span>Latest:<\/span> <span class=\"info-val\" id=\"valLatest\">-<\/span><\/div>\n\t\t\t<\/div>\n        <\/div>\n\n        <div class=\"filter-section\">\n            <div class=\"filter-label\">Filter by State<\/div>\n            <div id=\"stateFilters\"><\/div>\n        <\/div>\n    <\/div>\n\n    <div class=\"content\" id=\"mainContentBox\">\n        \n        <div id=\"centerWrapper\" style=\"display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0;\">\n            <div class=\"data-grid-container\" id=\"dataGrid\">\n                <div class=\"loading\">Loading biome data...<\/div>\n            <\/div>\n\n            <div id=\"tablePagination\" class=\"controls\" style=\"display: none; justify-content: center;\">\n                <button class=\"btn\" onclick=\"changeTablePage(-10000)\">|&lt;<\/button>\n                <button class=\"btn\" onclick=\"changeTablePage(-1)\">&lt;<\/button>\n\n                <span class=\"page-info\">Page<\/span>\n                <input type=\"text\" id=\"tablePageInput\" class=\"page-input\" value=\"1\" onkeydown=\"if(event.key==='Enter') goToTablePage(this.value)\">\n                <span class=\"page-info\" id=\"tableTotalPagesLabel\">of ?<\/span>\n\n                <button class=\"btn\" onclick=\"changeTablePage(1)\">&gt;<\/button>\n                <button class=\"btn\" onclick=\"changeTablePage(10000)\">&gt;|<\/button>\n\n                <span class=\"page-info\" style=\"margin-left: 20px;\">Rows per page:<\/span>\n                <select id=\"tablePageSizeSelect\" class=\"page-input\" onchange=\"changeTablePageSize(this.value)\">\n                    <option value=\"25\">25<\/option>\n                    <option value=\"50\">50<\/option>\n                    <option value=\"100\" selected>100<\/option>\n                    <option value=\"200\">200<\/option>\n                    <option value=\"500\">500<\/option>\n                    <option value=\"1000\">1000<\/option>\n                    <option value=\"custom\">Custom...<\/option>\n                <\/select>\n            <\/div>\n\n            <div id=\"monacoWrapper\" style=\"display:none; flex-direction: column; flex: 1;\">\n                <div style=\"padding: 10px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;\">\n                    <span style=\"font-size: 11px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase;\">Hex View (All bytes annotated)<\/span>\n                <\/div>\n                <div id=\"monacoContainer\"><\/div>\n            <\/div>\n        <\/div>\n\n        <div id=\"bottomPanel\">\n            <div class=\"bottom-panel-resizer\" id=\"bpResizer\"><\/div>\n            <div class=\"bottom-panel-header\">\n                <span id=\"bpTitle\">Entry Details<\/span>\n                <div style=\"display: flex; gap: 8px;\">\n                    <button class=\"btn\" id=\"bpExternalBtn\" style=\"display:none; height: 24px; padding: 0 8px; font-size: 11px;\">Open Blob in Viewer<\/button>\n                    <button class=\"btn\" id=\"dockToggleBtn\" onclick=\"togglePanelDock()\" style=\"height: 24px; padding: 0 8px; font-size: 14px;\" title=\"Dock Right\">\u25e8<\/button>\n                    <button class=\"btn\" onclick=\"closeBottomPanel()\" style=\"height: 24px; padding: 0 8px; font-size: 11px; border:none; background:transparent;\">\u2715<\/button>\n                <\/div>\n            <\/div>\n            <div class=\"bottom-tabs\">\n                <div class=\"bottom-tab active\" onclick=\"switchBpTab('decoded', this)\">Decoded<\/div>\n                <div class=\"bottom-tab\" onclick=\"switchBpTab('hex', this)\">Hex Dump<\/div>\n                <div class=\"bottom-tab\" onclick=\"switchBpTab('raw', this)\">Raw Base64<\/div>\n            <\/div>\n            <div class=\"bottom-panel-body\" id=\"bpBody\"><\/div>\n        <\/div>\n    <\/div>\n\n<!-- Data Detail Modal -->\n<div id=\"dataModal\" class=\"modal-overlay\" onclick=\"if(event.target===this)closeDataModal()\">\n    <div class=\"modal-window\">\n        <div class=\"modal-header\">\n            <span id=\"modalTitle\">Entry Data<\/span>\n            <button onclick=\"closeDataModal()\" class=\"btn\" style=\"padding:2px 8px; border:none;\">&#10005;<\/button>\n        <\/div>\n        <div class=\"modal-tabs\">\n            <div class=\"modal-tab active\" onclick=\"switchModalTab('decoded', this)\">Decoded<\/div>\n            <div class=\"modal-tab\" onclick=\"switchModalTab('hex', this)\">Hex Dump<\/div>\n            <div class=\"modal-tab\" onclick=\"switchModalTab('raw', this)\">Raw Base64<\/div>\n        <\/div>\n        <div class=\"modal-body\" id=\"modalBody\"><\/div>\n    <\/div>\n<\/div>\n\n<script>\n    const params = new URLSearchParams(window.PE_SEARCH);\n    const source = params.get('source');\n    const _isDiff = true;\n\tconst path    = params.get('path');\n    const apiBase = '/api/local';\n\n\t// Global state\n\tlet biomeData = null;\n\tlet allEntries = [];\n\tlet filteredEntries = [];\n\tlet rowCache = [];\n\t\n\t// --- Column State Tracking ---\n\tlet columnStateCache = {};\n\tlet currentDataColumnsCache = ['offset_hex', 'state', 'date1', 'date2', 'data_size', 'data_preview'];\n\tlet currentDataLabelsCache = ['Offset', 'State', 'Date', 'Date 2', 'Size', 'Data'];\n\t// ----------------------------------\n\t\n\tlet editor = null;\n\tlet hexRegions = [];\n\tlet currentDecorations = [];\n\tlet jumpDecorations = [];\n\tlet tableCurrentPage = 1;\n\tlet tablePageSize = 100;\n\tlet currentSortCol = null;\n\tlet currentSortDir = null;\n\tlet contextMenu = null;\n\tlet columnMenu = null;\n\tlet activeStateFilters = new Set();\n\tlet currentModalData = null;\n\n\tlet searchResults = [];\n\tlet currentSearchIndex = -1;\n\n\t// Initialize Monaco Editor\n    require.config({ paths: { vs: 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' } });\n    require(['vs/editor/editor.main'], () => {\n        editor = monaco.editor.create(document.getElementById('monacoContainer'), {\n            value: \"\",\n            language: 'plaintext',\n            theme: 'vs-dark',\n            automaticLayout: true,\n            readOnly: true,\n            fontFamily: \"'Fira Code', Consolas, monospace\",\n            fontSize: 13,\n            lineHeight: 20,\n            minimap: { enabled: true }\n        });\n    });\n\n\t\n\n\t\n\n\t\n\t\n\tfunction triggerExternalImport() {\n\t\tdocument.getElementById('externalFileInput').click();\n\t}\n\n\tdocument.getElementById('externalFileInput').addEventListener('change', async (e) => {\n\t\tconst file = e.target.files[0];\n\t\tif (!file) return;\n\n\t\t// 1. Read the first 16 bytes to determine file type client-side\n\t\tconst reader = new FileReader();\n\t\treader.onload = async function(e) {\n\t\t\tconst arr = new Uint8Array(e.target.result);\n\t\t\tlet hexHeader = \"\";\n\t\t\tfor (let i = 0; i < arr.length; i++) {\n\t\t\t\thexHeader += arr[i].toString(16).padStart(2, '0');\n\t\t\t}\n\n\t\t\tlet magicType = 'unknown';\n\t\t\tlet uploadEndpoint = `${apiBase}/upload-temp`; // Generic fallback\n\t\t\tlet viewerUrl = '';\n\n\t\t\t// --- CHECK MAGIC BYTES ---\n\t\t\t// SQLite format 3 (\"SQLite format 3\\0\") -> 53 51 4c 69 74 65...\n\t\t\tif (hexHeader.startsWith('53514c697465')) {\n\t\t\t\tmagicType = 'sqlite';\n\t\t\t\tuploadEndpoint = `${apiBase}/sqlite/upload-temp`;\n\t\t\t\tviewerUrl = 'view:sqlite';\n\t\t\t}\n\t\t\t// Apple SEGB (\"SEGB\") -> 53 45 47 42\n\t\t\telse if (hexHeader.startsWith('53454742') || hexHeader.includes('53454742')) {\n\t\t\t\tmagicType = 'segb';\n\t\t\t\tuploadEndpoint = `${apiBase}/segb/upload-temp`;\n\t\t\t\tviewerUrl = 'view:biome';\n\t\t\t}\n\t\t\t// Apple Binary Plist (\"bplist\") -> 62 70 6c 69 73 74\n\t\t\telse if (hexHeader.startsWith('62706c697374')) {\n\t\t\t\tmagicType = 'plist';\n\t\t\t\tuploadEndpoint = `${apiBase}/plist/upload-temp`;\n\t\t\t\tviewerUrl = 'view:plist';\n\t\t\t}\n\n\t\t\tif (magicType === 'unknown') { viewerUrl = 'view:hex'; }\n\n\t\t\t// 2. Upload the file to the determined endpoint\n\t\t\tdocument.getElementById('fileNameDisplay').innerText = `Uploading ${magicType.toUpperCase()}...`;\n\t\t\t\n\t\t\tconst formData = new FormData();\n\t\t\tformData.append('files[]', file);\n\n\t\t\ttry {\n\t\t\t\tconst res = await fetch(uploadEndpoint, {\n\t\t\t\t\tmethod: 'POST',\n\t\t\t\t\tbody: formData\n\t\t\t\t});\n\t\t\t\tconst data = await res.json();\n\n\t\t\t\tif (data.status === 'success') {\n\t\t\t\t\tPE.navigate(`${viewerUrl}?path=${encodeURIComponent(data.path)}`, window);\n\t\t\t\t} else {\n\t\t\t\t\talert(\"Upload failed: \" + data.error);\n\t\t\t\t\tdocument.getElementById('fileNameDisplay').innerText = \"Upload Failed\";\n\t\t\t\t}\n\t\t\t} catch (err) {\n\t\t\t\talert(\"Upload error: \" + err.message);\n\t\t\t\tdocument.getElementById('fileNameDisplay').innerText = \"Upload Failed\";\n\t\t\t}\n\t\t\t\n\t\t\tdocument.getElementById('externalFileInput').value = ''; \n\t\t};\n\n\t\t// Read the first 64 bytes to catch both V2 (offset 0) and V1 (offset 52) SEGB magic bytes\n        reader.readAsArrayBuffer(file.slice(0, 64));\n    });\n\n\t// ==================== DOWNLOAD ====================\n\tfunction downloadCurrentFile() {\n        if (!path) { alert('No file loaded.'); return; }\n        let fileName = path.split(/[\\/]/).pop() || 'file'; \n        PE.download(`${apiBase}/download-file?path=${encodeURIComponent(path)}`, fileName);\n    }\n\n\t// ==================== TOGGLE BIOME INFO ====================\n\tfunction toggleBiomeInfo() {\n        const content = document.getElementById('biomeInfoContent');\n        const icon = document.getElementById('biomeInfoToggleIcon');\n        const isHidden = content.style.display === 'none';\n        content.style.display = isHidden ? 'block' : 'none';\n        icon.innerHTML = isHidden ? '&#9660;' : '&#9654;';\n    }\n\n\t// ==================== INITIALIZATION ====================\n\tif (path) {\n\t\tfetch(`${apiBase}/segb/init`, {\n\t\t\tmethod: 'POST',\n\t\t\theaders: { 'Content-Type': 'application/json' },\n\t\t\tbody: JSON.stringify({ path: path })\n\t\t})\n\t\t.then(r => r.json())\n\t\t.then(data => {\n\t\t\tif (data.error) {\n\t\t\t\tdocument.getElementById('fileNameDisplay').innerText = \"Error: \" + data.error;\n\t\t\t\tdocument.getElementById('dataGrid').innerHTML = `<div class=\"error\">${data.error}<\/div>`;\n\t\t\t\treturn;\n\t\t\t}\n\t\t\tbiomeData = data;\n\t\t\tallEntries = data.entries || [];\n\t\t\thexRegions = data.hex_regions || [];\n\n\t\t\t// Update header\n\t\t\tdocument.getElementById('fileNameDisplay').innerText = data.filename || path.split(/[\\\\/]/).pop();\n\n\t\t\t// Update Biome Info\n\t\t\tdocument.getElementById('valBiomeVersion').innerText = data.version || '-';\n\t\t\tdocument.getElementById('valStoreVersion').innerText = data.store_version ?? '-';\n\t\t\tdocument.getElementById('valSegmentName').innerText = data.segment_name || '-';\n\t\t\tdocument.getElementById('valEntryCount').innerText = data.entry_count ?? allEntries.length;\n\t\t\tdocument.getElementById('valFileSize').innerText = data.file_size ? formatBytes(data.file_size) : '-';\n\t\t\tdocument.getElementById('valEarliest').innerText = data.earliest_timestamp || '-';\n\t\t\tdocument.getElementById('valLatest').innerText = data.latest_timestamp || '-';\n\n\t\t\t// Build state filters\n\t\t\tbuildStateFilters();\n\n\t\t\t// Build tabs\n\t\t\tbuildTabs();\n\n\t\t\t// Default: show table view\n\t\t\tapplyFilters();\n\t\t})\n\t\t.catch(err => {\n\t\t\tdocument.getElementById('fileNameDisplay').innerText = \"Load Failed\";\n\t\t\tdocument.getElementById('dataGrid').innerHTML = `<div class=\"error\">${err.message}<\/div>`;\n\t\t});\n\t} else {\n        document.getElementById('fileNameDisplay').innerText = \"No File Loaded\";\n        document.getElementById('dataGrid').innerHTML = '<div class=\"loading\">No SEGB file path provided.<\/div>';\n    }\n\n\tfunction formatBytes(bytes) {\n\t\tif (bytes < 1024) return bytes + ' B';\n\t\tif (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';\n\t\treturn (bytes / 1048576).toFixed(2) + ' MB';\n\t}\n\n\t// ==================== STATE FILTERS ====================\n\tfunction buildStateFilters() {\n\t\tconst container = document.getElementById('stateFilters');\n\t\tconst states = [...new Set(allEntries.map(e => e.state))];\n\n\t\tcontainer.innerHTML = '';\n\t\tstates.forEach(state => {\n\t\t\tconst count = allEntries.filter(e => e.state === state).length;\n\t\t\tconst btn = document.createElement('button');\n\t\t\tbtn.className = 'filter-btn active';\n\t\t\tbtn.innerText = `${state} (${count})`;\n\t\t\tbtn.dataset.state = state;\n\t\t\tactiveStateFilters.add(state);\n\t\t\tbtn.onclick = () => {\n\t\t\t\tif (activeStateFilters.has(state)) {\n\t\t\t\t\tactiveStateFilters.delete(state);\n\t\t\t\t\tbtn.classList.remove('active');\n\t\t\t\t} else {\n\t\t\t\t\tactiveStateFilters.add(state);\n\t\t\t\t\tbtn.classList.add('active');\n\t\t\t\t}\n\t\t\t\tapplyFilters();\n\t\t\t};\n\t\t\tcontainer.appendChild(btn);\n\t\t});\n\t}\n\n\tfunction applyFilters() {\n\t\tfilteredEntries = allEntries.filter(e => activeStateFilters.has(e.state));\n\t\trowCache = filteredEntries;\n\t\ttableCurrentPage = 1;\n\t\tcurrentSortCol = null;\n\t\tcurrentSortDir = null;\n\t\tdocument.getElementById('tablePagination').style.display = 'flex';\n\t\trenderTablePage();\n\t}\n\t\n\t// --- RECURSIVE BLOB & PLIST RENDERING ENGINE ---\n\t// --- SYNCHRONOUS PRE-PARSED RENDERER ---\n\tlet globalBlobCounter = 0;\n\n\tfunction generateHexDump(b64) {\n\t\tlet hexDump = '';\n\t\ttry {\n\t\t\tconst raw = atob(b64);\n\t\t\tconst limit = Math.min(raw.length, 512); \n\t\t\tfor (let i = 0; i < limit; i += 16) {\n\t\t\t\tconst slice = raw.slice(i, i + 16);\n\t\t\t\tconst offset = (i).toString(16).padStart(4, '0');\n\t\t\t\tconst hexBytes = Array.from(slice).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ').padEnd(47, ' ');\n\t\t\t\tconst ascii = Array.from(slice).map(c => { const code = c.charCodeAt(0); return code >= 32 && code <= 126 ? c : '.'; }).join('');\n\t\t\t\thexDump += `${offset}  ${hexBytes}  |${ascii}|\\n`;\n\t\t\t}\n\t\t\tif (raw.length > limit) hexDump += `\\n... [${raw.length - limit} more bytes, open externally to view full data] ...`;\n\t\t} catch(e) { hexDump = 'Failed to decode base64.'; }\n\t\treturn hexDump;\n\t}\n\n\tfunction buildBlobBox(label, b64, contentHtml, marginLeft, btnText = \"Open Externally\") {\n\t\tglobalBlobCounter++;\n\t\tconst id = `inline-blob-${Date.now()}-${globalBlobCounter}`;\n\t\t\n\t\t// FIX: Removed the leading \\n from the return string\n\t\treturn `<div class=\"inline-blob-box\" style=\"margin-left: ${marginLeft}px; margin-top: 4px; margin-bottom: 4px; display: block; width: fit-content; min-width: 60%;\">\n\t\t\t<div class=\"inline-blob-header\">\n\t\t\t\t<span>${escapeHtml(label)}<\/span>\n\t\t\t\t<button class=\"btn\" style=\"height: 22px; font-size: 11px; padding: 0 8px; margin: 0;\" onclick=\"analyzeBlob('${b64}', 'view')\">${btnText}<\/button>\n\t\t\t<\/div>\n\t\t\t<div class=\"inline-blob-content\" id=\"${id}\" style=\"${!btnText.includes('Plist') ? 'color: var(--text-secondary);' : ''}\">${contentHtml}<\/div>\n\t\t<\/div>`;\n\t}\n\n\tfunction convertParsedTreeToHtml(data, depth = 0, fieldLabel = \"\") {\n\t\tconst indent = '  '.repeat(depth);\n\t\tconst marginLeft = depth * 12;\n\n\t\tif (data === null) return '<span style=\"color: #8b949e;\">null<\/span>';\n\t\tif (typeof data !== 'object') {\n\t\t\tif (typeof data === 'string') return `<span style=\"color: #a5d6ff;\">\"${escapeHtml(data)}\"<\/span>`;\n\t\t\tif (typeof data === 'number') return `<span style=\"color: #79c0ff;\">${data}<\/span>`;\n\t\t\tif (typeof data === 'boolean') return `<span style=\"color: #56d364;\">${data}<\/span>`;\n\t\t\treturn escapeHtml(String(data));\n\t\t}\n\n\t\tif (Array.isArray(data)) {\n\t\t\t// Check if this array is actually a Protobuf field list\n\t\t\tif (data.length > 0 && data[0].field !== undefined && data[0].wire_type !== undefined) {\n\t\t\t\tconst sortedFields = [...data].sort((a, b) => a.field - b.field);\n\t\t\t\t\n\t\t\t\t// FIX: Collect parts in an array to avoid leading newlines on the first element\n\t\t\t\tlet htmlParts = [];\n\n\t\t\t\tsortedFields.forEach(f => {\n\t\t\t\t\tconst fLabel = `Field ${f.field}`;\n\t\t\t\t\tif (f.wire_type === 'plist') {\n\t\t\t\t\t\thtmlParts.push(buildBlobBox(`${fLabel} (Embedded Plist, ${f.size} bytes)`, f.b64, convertParsedTreeToHtml(f.parsed, depth + 1), marginLeft, \"Open in Plist Viewer\"));\n\t\t\t\t\t} else if (f.wire_type === 'embedded_protobuf') {\n\t\t\t\t\t\thtmlParts.push(buildBlobBox(`${fLabel} (Embedded Protobuf, ${f.size} bytes)`, f.b64, convertParsedTreeToHtml(f.parsed, depth + 1), marginLeft, \"Open in Hex/Decoder\"));\n\t\t\t\t\t} else if (f.wire_type === 'message') {\n\t\t\t\t\t\thtmlParts.push(`${indent}<span style=\"color: #d2a8ff;\">${fLabel}<\/span> { \\n${convertParsedTreeToHtml(f.value, depth + 1)}\\n${indent}}`);\n\t\t\t\t\t} else if (f.wire_type === 'bytes') {\n\t\t\t\t\t\tconst hexContent = `<span style=\"color: var(--text-secondary);\">${escapeHtml(generateHexDump(f.b64))}<\/span>`;\n\t\t\t\t\t\thtmlParts.push(buildBlobBox(`${fLabel} (Binary Blob, ${f.length} bytes)`, f.b64, hexContent, marginLeft, \"Open Externally\"));\n\t\t\t\t\t} else {\n\t\t\t\t\t\tconst extra = f.possible_date ? ` <span style=\"color: var(--blue);\">(${f.possible_date})<\/span>` : '';\n\t\t\t\t\t\tlet val = f.value !== undefined ? f.value : (f.float_value !== undefined ? f.float_value : f.int_value);\n\t\t\t\t\t\thtmlParts.push(`${indent}<span style=\"color: #d2a8ff;\">${fLabel}<\/span>: ${convertParsedTreeToHtml(val, depth + 1)}${extra}`);\n\t\t\t\t\t}\n\t\t\t\t});\n\t\t\t\t\n\t\t\t\t// FIX: Join with newlines only between the items!\n\t\t\t\treturn htmlParts.join('\\n');\n\t\t\t}\n\n\t\t\t// Standard JSON Array\n\t\t\tif (data.length === 0) return '[]';\n\t\t\tlet html = '[\\n';\n\t\t\tfor (let i = 0; i < data.length; i++) {\n\t\t\t\thtml += `${indent}  ${convertParsedTreeToHtml(data[i], depth + 1)}`;\n\t\t\t\tif (i < data.length - 1) html += ',';\n\t\t\t\thtml += '\\n';\n\t\t\t}\n\t\t\thtml += `${indent}]`;\n\t\t\treturn html;\n\t\t}\n\n\t\t// Catch backend-resolved Plists and Protobufs natively\n\t\tif (data.__type === 'nested_plist') {\n\t\t\treturn buildBlobBox(fieldLabel || `Root Embedded Plist (${data.size} bytes)`, data.b64, convertParsedTreeToHtml(data.parsed, depth + 1), marginLeft, \"Open in Plist Viewer\");\n\t\t}\n\t\tif (data.__type === 'nested_protobuf') {\n\t\t\treturn buildBlobBox(fieldLabel || `Embedded Protobuf (${data.size} bytes)`, data.b64, convertParsedTreeToHtml(data.parsed, depth + 1), marginLeft, \"Open in Hex/Decoder\");\n\t\t}\n\t\tif (data.__type === 'blob') {\n\t\t\tconst hexContent = `<span style=\"color: var(--text-secondary);\">${escapeHtml(generateHexDump(data.data))}<\/span>`;\n\t\t\treturn buildBlobBox(fieldLabel || `Root Binary Blob (${data.size} bytes)`, data.data, hexContent, marginLeft, \"Open Externally\");\n\t\t}\n\t\tif (data.__type === 'uid') {\n\t\t\treturn `<span style=\"color: #d19a66;\">&lt;UID: ${escapeHtml(String(data.value))}&gt;<\/span>`;\n\t\t}\n\n\t\t// Standard JSON Object Traversal\n\t\tconst keys = Object.keys(data);\n\t\tif (keys.length === 0) return '{}';\n\t\tlet html = '{\\n';\n\t\tfor (let i = 0; i < keys.length; i++) {\n\t\t\tconst k = keys[i];\n\t\t\thtml += `${indent}  <span style=\"color: #79c0ff;\">\"${escapeHtml(k)}\"<\/span>: ${convertParsedTreeToHtml(data[k], depth + 1)}`;\n\t\t\tif (i < keys.length - 1) html += ',';\n\t\t\thtml += '\\n';\n\t\t}\n\t\thtml += `${indent}}`;\n\t\treturn html;\n\t}\n\t\n\tfunction renderDecodedContent(container, entry) {\n\t\tif (!entry.fully_parsed_tree) {\n\t\t\tcontainer.innerHTML = `<div style=\"color: var(--text-secondary); margin-bottom: 8px;\">Raw text / hex:<\/div><div>${escapeHtml(entry.data_text)}<\/div>`;\n\t\t\treturn;\n\t\t}\n\n\t\tlet html = '';\n\t\tconst rootData = entry.fully_parsed_tree;\n\n\t\t// If the absolute root of the entry is a Protobuf, strip the box and render natively\n\t\tif (rootData.__type === 'nested_protobuf') {\n\t\t\thtml += `<div style=\"color: #3fb950; font-weight: bold; margin-bottom: 8px;\">Protobuf Decoded:<\/div>`;\n\t\t\t// Pass 'rootData.parsed' directly to bypass the box generator\n\t\t\thtml += `<div>${convertParsedTreeToHtml(rootData.parsed, 0)}<\/div>`;\n\t\t} else {\n\t\t\thtml += `<div>${convertParsedTreeToHtml(rootData, 0)}<\/div>`;\n\t\t}\n\n\t\tcontainer.innerHTML = html;\n\t}\n\t\n\t// Recursive JSON to HTML Converter\n\tfunction convertPlistDataToHtml(data, pendingTasks, depth = 0) {\n\t\tconst indent = '  '.repeat(depth);\n\t\t\n\t\tif (data === null) return '<span style=\"color: #8b949e;\">null<\/span>';\n\t\tif (typeof data !== 'object') {\n\t\t\tif (typeof data === 'string') return `<span style=\"color: #a5d6ff;\">\"${escapeHtml(data)}\"<\/span>`;\n\t\t\tif (typeof data === 'number') return `<span style=\"color: #79c0ff;\">${data}<\/span>`;\n\t\t\tif (typeof data === 'boolean') return `<span style=\"color: #56d364;\">${data}<\/span>`;\n\t\t\treturn escapeHtml(String(data));\n\t\t}\n\n\t\tif (Array.isArray(data)) {\n\t\t\tif (data.length === 0) return '[]';\n\t\t\tlet html = '[\\n';\n\t\t\tfor (let i = 0; i < data.length; i++) {\n\t\t\t\thtml += `${indent}  ${convertPlistDataToHtml(data[i], pendingTasks, depth + 1)}`;\n\t\t\t\tif (i < data.length - 1) html += ',';\n\t\t\t\thtml += '\\n';\n\t\t\t}\n\t\t\thtml += `${indent}]`;\n\t\t\treturn html;\n\t\t}\n\n\t\t// MAGIC: Catch nested blobs!\n\t\tif (data.__type === 'blob') {\n\t\t\tglobalBlobCounter++;\n\t\t\tconst id = `inline-blob-${globalBlobCounter}-${Date.now()}`;\n\t\t\tpendingTasks.push({ id, b64: data.data });\n\t\t\tconst approxBytes = Math.floor(data.data.length * 0.75);\n\n\t\t\treturn `\\n${indent}<div class=\"inline-blob-box\" style=\"display: inline-block; min-width: 400px; max-width: 100%; margin-top: 4px; vertical-align: top;\">\n\t\t\t\t<div class=\"inline-blob-header\" style=\"background: var(--surface);\">\n\t\t\t\t\t<span id=\"label-${id}\">Nested Blob (~${approxBytes} bytes)<\/span>\n\t\t\t\t\t<button class=\"btn\" style=\"height: 22px; font-size: 11px; padding: 0 8px; margin: 0;\" onclick=\"analyzeBlob('${data.data}', 'view')\">Open in Viewer<\/button>\n\t\t\t\t<\/div>\n\t\t\t\t<div class=\"inline-blob-content\" id=\"${id}\">Analyzing nested blob...<\/div>\n\t\t\t<\/div>`;\n\t\t}\n\n\t\t// Catch pointers\n\t\tif (data.__type === 'uid') {\n\t\t\treturn `<span style=\"color: #d19a66;\">&lt;UID: ${escapeHtml(String(data.value))}&gt;<\/span>`;\n\t\t}\n\n\t\t// Standard Object Traversal\n\t\tconst keys = Object.keys(data);\n\t\tif (keys.length === 0) return '{}';\n\t\tlet html = '{\\n';\n\t\tfor (let i = 0; i < keys.length; i++) {\n\t\t\tconst k = keys[i];\n\t\t\thtml += `${indent}  <span style=\"color: #79c0ff;\">\"${escapeHtml(k)}\"<\/span>: ${convertPlistDataToHtml(data[k], pendingTasks, depth + 1)}`;\n\t\t\tif (i < keys.length - 1) html += ',';\n\t\t\thtml += '\\n';\n\t\t}\n\t\thtml += `${indent}}`;\n\t\treturn html;\n\t}\n\n\t// ==================== TABS ====================\n\tfunction buildTabs() {\n        const tabContainer = document.getElementById('modeTabs');\n        tabContainer.innerHTML = '';\n\n        const tableBtn = document.createElement('div');\n        tableBtn.className = 'tab active';\n        tableBtn.innerText = 'Table View';\n        tableBtn.onclick = () => switchMode('table', tableBtn);\n        tabContainer.appendChild(tableBtn);\n\n        const hexBtn = document.createElement('div');\n        hexBtn.className = 'tab';\n        hexBtn.innerText = 'Hex View';\n        hexBtn.onclick = () => switchMode('hex', hexBtn);\n        tabContainer.appendChild(hexBtn);\n    }\n\n    function switchMode(mode, btnElement) {\n        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));\n        btnElement.classList.add('active');\n\n        if (mode === 'hex') {\n coded', document.querySelector('.bottom-tab'));\n\t}\n\n\t// ==================== KEYBOARD NAVIGATION ====================\n\tdocument.addEventListener('keydown', (e) => {\n\t\t// Do not intercept keystrokes if the user is typing in a search box or input field\n\t\tif (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') {\n\t\t\treturn;\n\t\t}\n\n\t\t// Ctrl+C: copy selected cell(s)\n\t\tif ((e.ctrlKey || e.metaKey) && e.key === 'c') {\n\t\t\tif (selectedCells.size === 1) { copySingleCell(); }\n\t\t\telse if (selectedCells.size > 1) { copySelectedAsJSON(); }\n\t\t\treturn;\n\t\t}\n\n\t\t// Only navigate if a row is currently selected\n\t\tif (currentSelectedRowIdx !== -1) {\n\t\t\tif (e.key === 'ArrowUp') {\n\t\t\t\te.preventDefault(); // Prevents the whole browser window from scrolling\n\t\t\t\tnavigateRow(-1);\n\t\t\t} else if (e.key === 'ArrowDown') {\n\t\t\t\te.preventDefault();\n\t\t\t\tnavigateRow(1);\n\t\t\t}\n\t\t}\n\t});\n\n\tfunction navigateRow(direction) {\n\t\tlet newIdx = currentSelectedRowIdx + direction;\n\t\t\n\t\t// 1. Prevent out-of-bounds errors\n\t\tif (newIdx < 0 || newIdx >= rowCache.length) return;\n\n\t\t// 2. Handle Pagination: If the next row is on a different page, flip the page automatically!\n\t\tconst targetPage = Math.floor(newIdx / tablePageSize) + 1;\n\t\tif (targetPage !== tableCurrentPage) {\n\t\t\ttableCurrentPage = targetPage;\n\t\t\trenderTablePage(); \n\t\t}\n\n\t\t// 3. Select the new row (update cell selection for visual feedback)\n\t\tconst prevKey = [...selectedCells][0];\n\t\tconst prevCol = prevKey ? parseInt(prevKey.split(':')[1]) : 0;\n\t\tselectedCells.clear();\n\t\tselectedCells.add(`${newIdx}:${prevCol}`);\n\t\tapplySelectedCellStyles();\n\t\tselectRow(newIdx);\n\n\t\t// 4. Smoothly scroll the newly selected row into view\n\t\t// Use a 50ms timeout to ensure the DOM has updated if a page flip occurred\n\t\tsetTimeout(() => {\n\t\t\tconst rowEl = document.getElementById(` .getElementById('mainContentBox');\n\t\tconst panel = document.getElementById('bottomPanel');\n\t\tconst btn = document.getElementById('dockToggleBtn');\n\t\t\n\t\tisDockedRight = !isDockedRight;\n\t\t\n\t\tif (isDockedRight) {\n\t\t\tcontentBox.classList.add('panel-right');\n\t\t\tbtn.innerHTML = '\u2b12'; // Visual icon for \"Dock Bottom\"\n\t\t\tbtn.title = \"Dock Bottom\";\n\t\t\t\n\t\t\t// Clear inline height so CSS takes over, and restore previous width if it exists\n\t\t\tpanel.style.height = ''; \n\t\t\tif (!panel.style.width) panel.style.width = '40%';\n\t\t} else {\n\t\t\tcontentBox.classList.remove('panel-right');\n\t\t\tbtn.innerHTML = '\u25e8'; // Visual icon for \"Dock Right\"\n\t\t\tbtn.title = \"Dock Right\";\n\t\t\t\n\t\t\t// Clear inline width so CSS takes over, and restore previous height if it exists\n\t\t\tpanel.style.width = '';\n\t\t\tif (!panel.style.height) panel.style.height = '35%';\n\t\t}\n\t}\n\n\t// Dynamic X/Y Resizer\n\tdocument.addEventListener('DOMContentLoaded', () => {\n\t\tlet isResizing = false;\n\t\tconst resizer = document.getElementById('bpResizer');\n\t\tconst panel = document.getElementById('bottomPanel');\n\t\tconst contentArea = document.getElementById('mainContentBox');\n\t\t\n\t\tresizer.addEventListener('mousedown', (e) => {\n\t\t\tisResizing = true;\n\t\t\tdocument.body.style.cursor = isDockedRight ? 'ew-resize' : 'ns-resize';\n\t\t\te.preventDefault(); // Prevents text highlighting while dragging\n\t\t});\n\t\t\n\t\tdocument.addEventListener('mousemove', (e) => {\n\t\t\tif (!isResizing) return;\n\t\t\tconst containerRect = contentArea.getBoundingClientRect();\n\t\t\t\n\t\t\tif (isDockedRight) {\n\t\t\t\t// Calculate new width relative to the right edge\n\t\t\t\tconst newWidth = containerRect.right - e.clientX; \n\t\t\t\tif (newWidth > 200 && newWidth < containerRect.width - 200) {\n\t\t\t\t\tpanel.style.width = `${newWidth}px`;\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\t// Calculate new height relative to the bottom edge\n\t\t\t\tconst newHeight = containerRect.bottom - e.clientY; \n\t\t\t\tif (newHeight > 100 && newHeight < containerRect.height - 100) {\n\t\t\t\t\tpanel.style.height = `${newHeight}px`;\n\t\t\t\t}\n\t\t\t}\n\t\t});\n\t\t\n\t\tdocument.addEventListener('mouseup', () => {\n\t\t\tif (isResizing) {\n\t\t\t\tisResizing = false;\n\t\t\t\tdocument.body.style.cursor = '';\n\t\t\t}\n\t\t\tisCellDragging = false;\n\t\t});\n\n\t\t// Cell selection event delegation\n\t\tconst dataGrid = document.getElementById('dataGrid');\n\t\tdataGrid.addEventListener('mousedown', (e) => {\n\t\t\tif (e.button !== 0) return;\n\t\t\tconst td = e.target.closest('td[data-row-idx]');\n\t\t\tif (!td) return;\n\t\t\tconst rowIdx = parseInt(td.dataset.rowIdx);\n\t\t\tconst colIdx = parseInt(td.dataset.colIdx);\n\t\t\tif (isNaN(rowIdx) || isNaN(colIdx)) return;\n\t\t\tconst key = `${rowIdx}:${colIdx}`;\n\t\t\tif (e.ctrlKey || e.metaKey) {\n\t\t\t\tif (selectedCells.has(key)) selectedCells.delete(key);\n\t\t\t\telse selectedCells.add(key);\n\t\t\t} else {\n\t\t\t\tselectedCells.clear();\n\t\t\t\tselectedCells.add(key);\n\t\t\t\tisCellDragging = true;\n\t\t\t\tdragStartRow = rowIdx;\n\t\t\t\tdragStartCol = colIdx;\n\t\t\t}\n\t\t\tapplySelectedCellStyles();\n\t\t\tselectRow(rowIdx);\n\t\t});\n\n\t\tdataGrid.addEventListener('mousemove', (e) => {\n\t\t\tif (!isCellDragging) return;\n\t\t\tconst td = e.target.closest('td[data-row-idx]');\n\t\t\tif (!td) return;\n\t\t\tconst rowIdx = parseInt(td.dataset.rowIdx);\n\t\t\tconst colIdx = parseInt(td.dataset.colIdx);\n\t\t\tif (isNaN(rowIdx) || isNaN(colIdx)) return;\n\t\t\tselectedCells.clear();\n\t\t\tconst minR = Math.min(dragStartRow, rowIdx), maxR = Math.max(dragStartRow, rowIdx);\n\t\t\tconst minC = Math.min(dragStartCol, colIdx), maxC = Math.max(dragStartCol, colIdx);\n\t\t\tfor (let r = minR; r <= maxR; r++)\n\t\t\t\tfor (let c = minC; c <= maxC; c++)\n\t\t\t\t\tselectedCells.add(`${r}:${c}`);\n\t\t\tapplySelectedCellStyles();\n\t\t});\n\n\t\tdataGrid.addEventListener('contextmenu', (e) => {\n\t\t\tconst td = e.target.closest('td[data-row-idx]');\n\t\t\tif (!td) return;\n\t\t\te.preventDefault();\n\t\t\tconst rowIdx = parseInt(td.dataset.rowIdx);\n\t\t\tconst colIdx = parseInt(td.dataset.colIdx);\n\t\t\tif (!isNaN(rowIdx) && !isNaN(colIdx)) showContextMenu(e, rowIdx, colIdx);\n\t\t});\n\t});\n\n\t// ==================== TABLE INTERACTIVITY ====================\n\tfunction initTableInteractivity() {\n\t\tconst table = document.getElementById('mainBiomeTable');\n\t\tif (!table) return;\n\t\ttable.querySelectorAll('th').forEach(th => {\n\t\t\tth.addEventListener('dragstart', e => {\n\t\t\t\te.dataTransfer.setData('text/plain', th.cellIndex);\n\t\t\t\tth.classList.add('dragging');\n\t\t\t});\n\t\t\tth.addEventListener('dragover', e => { e.preventDefault(); th.classList.add('drag-over'); });\n\t\t\tth.addEventListener('dragleave', e => th.classList.remove('drag-over'));\n\t\t\tth.addEventListener('drop', e => {\n\t\t\t\te.preventDefault();\n\t\t\t\tth.classList.remove('drag-over');\n\t\t\t\tlet oldIdx = parseInt(e.dataTransfer.getData('text/plain'));\n\t\t\t\tlet newIdx = th.cellIndex;\n\t\t\t\t\n\t\t\t\tif (oldIdx !== newIdx && !isNaN(oldIdx)) {\n\t\t\t\t\t// 1. Reorder live DOM\n\t\t\t\t\tArray.from(table.rows).forEach(row => {\n\t\t\t\t\t\tlet cells = Array.from(row.children);\n\t\t\t\t\t\tif(oldIdx < newIdx) row.insertBefore(cells[oldIdx], cells[newIdx].nextSibling);\n\t\t\t\t\t\telse row.insertBefore(cells[oldIdx], cells[newIdx]);\n\t\t\t\t\t});\n\t\t\t\t\t\n\t\t\t\t\t// 2. Save new order to cache\n\t\t\t\t\tconst movedCol = currentDataColumnsCache.splice(oldIdx, 1)[0];\n\t\t\t\t\tcurrentDataColumnsCache.splice(newIdx, 0, movedCol);\n\t\t\t\t\t\n\t\t\t\t\tconst movedLabel = currentDataLabelsCache.splice(oldIdx, 1)[0];\n\t\t\t\t\tcurrentDataLabelsCache.splice(newIdx, 0, movedLabel);\n\t\t\t\t}\n\t\t\t});\n\t\t\tth.addEventListener('dragend', e => th.classList.remove('dragging'));\n\t\t});\n\t}\n\t\n\t// ==================== COLUMN VISIBILITY MENU ====================\n\tfunction showColumnMenu(e, tableId) {\n\t\te.preventDefault();\n\t\tif (columnMenu) columnMenu.remove();\n\n\t\tcolumnMenu = document.createElement('div');\n\t\tcolumnMenu.className = 'column-context-menu';\n\n\t\tconst menuHeight = 400;\n\t\tlet topPos = e.pageY;\n\t\tif (topPos + menuHeight > window.innerHeight) topPos = window.innerHeight - menuHeight - 20;\n\n\t\tcolumnMenu.style.left = e.pageX + 'px';\n\t\tcolumnMenu.style.top = topPos + 'px';\n\t\tcolumnMenu.style.display = 'block';\n\n\t\tlet menuContent = `<div style=\"padding:4px 12px; font-size:11px; color:var(--text-secondary); text-transform:uppercase; border-bottom:1px solid var(--border); margin-bottom:4px; position: sticky; top: 0; background: var(--surface2); z-index: 10;\">Hide/Show Columns<\/div>`;\n\n\t\tcurrentDataColumnsCache.forEach((colName, idx) => {\n\t\t\tconst label = currentDataLabelsCache[idx];\n\t\t\tlet isVisible = !(columnStateCache[colName] && columnStateCache[colName].hidden);\n\t\t\tmenuContent += `\n\t\t\t\t<label class=\"col-menu-item\" style=\"display: flex; cursor: pointer; align-items: center; gap: 8px;\">\n\t\t\t\t\t<input type=\"checkbox\" ${isVisible ? 'checked' : ''} onchange=\"toggleColumn('${colName}')\"> \n\t\t\t\t\t<span>${escapeHtml(label)}<\/span>\n\t\t\t\t<\/label>`;\n\t\t});\n\n\t\tcolumnMenu.innerHTML = menuContent;\n\t\tdocument.body.appendChild(columnMenu);\n\n\t\tconst close = (ev) => {\n\t\t\tif (columnMenu && !columnMenu.contains(ev.target)) { columnMenu.remove(); document.removeEventListener('mousedown', close); }\n\t\t};\n\t\tsetTimeout(() => document.addEventListener('mousedown', close), 10);\n\t}\n\n\tfunction toggleColumn(colName) {\n\t\tif (!columnStateCache[colName]) {\n\t\t\tcolumnStateCache[colName] = { hidden: false, width: '' };\n\t\t}\n\t\tcolumnStateCache[colName].hidden = !columnStateCache[colName].hidden;\n\t\trenderTablePage();\n\t}\n\n\t// ==================== SORTING ====================\n\tfunction sortTable(colName) {\n\t\tif (currentSortCol === colName) {\n\t\t\tcurrentSortDir = currentSortDir === 'asc' ? 'desc' : 'asc';\n\t\t} else {\n\t\t\tcurrentSortCol = colName;\n\t\t\tcurrentSortDir = 'asc';\n\t\t}\n\n\t\trowCache.sort((a, b) => {\n\t\t\tlet x = a[colName]; let y = b[colName];\n\t\t\tlet valX = String(x !== null && x !== undefined ? x : \"\").toLowerCase();\n\t\t\tlet valY = String(y !== null && y !== undefined ? y : \"\").toLowerCase();\n\t\t\treturn currentSortDir === 'asc'\n\t\t\t\t? valX.localeCompare(valY, undefined, {numeric: true})\n\t\t\t\t: valY.localeCompare(valX, undefined, {numeric: true});\n\t\t});\n\n\t\ttableCurrentPage = 1;\n\t\trenderTablePage();\n\t\tdocument.getElementById('dataGrid').scrollTop = 0;\n\t}\n\n\t// ==================== PAGINATION ====================\n\tfunction changeTablePage(delta) {\n\t\tconst totalPages = Math.ceil(rowCache.length / tablePageSize) || 1;\n\t\tlet newPage = tableCurrentPage + delta;\n\t\tif (newPage < 1) newPage = 1;\n\t\tif (newPage > totalPages) newPage = totalPages;\n\t\tif (newPage !== tableCurrentPage) {\n\t\t\ttableCurrentPage = newPage;\n\t\t\trenderTablePage();\n\t\t\tdocument.getElementById('dataGrid').scrollTop = 0;\n\t\t}\n\t}\n\n\tfunction goToTablePage(val) {\n\t\tlet newPage = parseInt(val);\n\t\tif (!isNaN(newPage)) {\n\t\t\tconst totalPages = Math.ceil(rowCache.length / tablePageSize) || 1;\n\t\t\tif (newPage < 1) newPage = 1;\n\t\t\tif (newPage > totalPages) newPage = totalPages;\n\t\t\ttableCurrentPage = newPage;\n\t\t\trenderTablePage();\n\t\t\tdocument.getElementById('dataGrid').scrollTop = 0;\n\t\t} else {\n\t\t\tdocument.getElementById('tablePageInput').value = tableCurrentPage;\n\t\t}\n\t}\n\n\tfunction changeTablePageSize(val) {\n\t\tif (val === 'custom') {\n\t\t\tconst customSize = prompt(\"Enter number of rows per page:\", tablePageSize);\n\t\t\tconst parsed = parseInt(customSize);\n\t\t\tif (!isNaN(parsed) && parsed > 0) {\n\t\t\t\ttablePageSize = parsed;\n\t\t\t\tconst select = document.getElementById('tablePageSizeSelect');\n\t\t\t\tlet found = false;\n\t\t\t\tfor (let i = 0; i < select.options.length; i++) {\n\t\t\t\t\tif (select.options[i].value == parsed) { select.selectedIndex = i; found = true; break; }\n\t\t\t\t}\n\t\t\t\tif (!found) {\n\t\t\t\t\tconst opt = document.createElement('option');\n\t\t\t\t\topt.value = parsed; opt.innerText = parsed; opt.selected = true;\n\t\t\t\t\tselect.insertBefore(opt, select.lastElementChild);\n\t\t\t\t}\n\t\t\t} else {\n\t\t\t\tdocument.getElementById('tablePageSizeSelect').value = tablePageSize;\n\t\t\t\treturn;\n\t\t\t}\n        } else {\n            tablePageSize = parseInt(val);\n        }\n        tableCurrentPage = 1;\n        renderTablePage();\n        document.getElementById('dataGrid').scrollTop = 0;\n    }\n\n\t// ==================== CONTEXT MENU ====================\n\tfunction showContextMenu(e, rowIdx, colIdx) {\n\t\te.preventDefault();\n\t\tif (contextMenu) contextMenu.remove();\n\n\t\tconst key = `${rowIdx}:${colIdx}`;\n\t\tif (!selectedCells.has(key)) {\n\t\t\tselectedCells.clear();\n\t\t\tselectedCells.add(key);\n\t\t\tapplySelectedCellStyles();\n\t\t\tselectRow(rowIdx);\n\t\t}\n\n\t\tcontextMenu = document.createElement('div');\n\t\tcontextMenu.className = 'custom-context-menu';\n\t\tcontextMenu.style.top = `${e.pageY}px`;\n\t\tcontextMenu.style.left = `${e.pageX}px`;\n\n\t\tconst multi = selectedCells.size > 1;\n\t\tcontextMenu.innerHTML = `\n\t\t\t<div class=\"menu-item\" onclick=\"${multi ? 'copySelectedAsJSON()' : 'copySingleCell()'}\">${multi ? 'Copy as JSON' : 'Copy'}<\/div>\n\t\t\t<div class=\"menu-item\" onclick=\"exportSelectionToPNG()\">Export to PNG<\/div>\n\t\t\t<div class=\"menu-item\" onclick=\"openDataModal(${rowIdx})\">View Full Data<\/div>\n\t\t\t<div class=\"menu-item\" onclick=\"jumpToEntryInHex(${rowIdx})\">Open In Hex View<\/div>\n\t\t`;\n\t\tdocument.body.appendChild(contextMenu);\n\t\tconst closeMenu = () => { contextMenu?.remove(); document.removeEventListener('click', closeMenu); };\n\t\tsetTimeout(() => document.addEventListener('click', closeMenu), 10);\n\t}\n\n\tfunction copySingleCell() {\n\t\tif (selectedCells.size === 0) return;\n\t\tconst key = [...selectedCells][0];\n\t\tconst [rowIdx, colIdx] = key.split(':').map(Number);\n\t\tconst entry = rowCache[rowIdx];\n\t\tconst col = currentDataColumnsCache[colIdx];\n\t\tconst val = entry ? entry[col] : null;\n\t\tconst text = val === null || val === undefined ? '' : (typeof val === 'object' ? JSON.stringify(val) : String(val));\n\t\tnavigator.clipboard.writeText(text);\n\t\tif (contextMenu) contextMenu.remove();\n\t}\n\n\tfunction copySelectedAsJSON() {\n\t\tconst items = [];\n\t\t[...selectedCells].sort().forEach(key => {\n\t\t\tconst [rowIdx, colIdx] = key.split(':').map(Number);\n\t\t\tconst entry = rowCache[rowIdx];\n\t\t\tconst col = currentDataColumnsCache[colIdx];\n\t\t\tconst val = entry ? entry[col] : null;\n\t\t\titems.push({ row: entry?.index ?? rowIdx, column: col, value: val });\n\t\t});\n\t\tnavigator.clipboard.writeText(JSON.stringify(items, null, 2));\n\t\tif (contextMenu) contextMenu.remove();\n\t}\n\n\tfunction applySelectedCellStyles() {\n\t\tdocument.querySelectorAll('#mainBiomeTable td.selected-cell').forEach(td => td.classList.remove('selected-cell'));\n\t\tselectedCells.forEach(key => {\n\t\t\tconst [r, c] = key.split(':').map(Number);\n\t\t\tconst tr = document.getElementById(`row-${r}`);\n\t\t\tif (tr) {\n\t\t\t\tconst td = tr.cells[c];\n\t\t\t\tif (td) td.classList.add('selected-cell');\n\t\t\t}\n\t\t});\n\t}\n\n\tfunction fillTextEllipsis(ctx, text, x, y, maxWidth) {\n\t\tif (!text || ctx.measureText(text).width <= maxWidth) {\n\t\t\tctx.fillText(text || '', x, y);\n\t\t\treturn;\n\t\t}\n\t\tconst ellipsis = '\u2026';\n\t\tconst ew = ctx.measureText(ellipsis).width;\n\t\tlet t = text;\n\t\twhile (t.length > 0 && ctx.measureText(t).width + ew > maxWidth) t = t.slice(0, -1);\n\t\tctx.fillText(t + ellipsis, x, y);\n\t}\n\n\tfunction getSegbCellText(entry, col) {\n\t\tif (!entry) return '';\n\t\tif (col === 'offset_hex') return entry.offset_hex || '';\n\t\tif (col === 'state') return entry.state || '';\n\t\tif (col === 'date1') return entry.date1 || '-';\n\t\tif (col === 'date2') return entry.date2 || '-';\n\t\tif (col === 'data_size') return entry.data_size != null ? entry.data_size + ' bytes' : '';\n\t\tif (col === 'data_preview') return truncate(entry.data_text || entry.data_hex || '', 80);\n\t\treturn String(entry[col] != null ? entry[col] : '');\n\t}\n\n\tfunction exportSelectionToPNG() {\n\t\tif (contextMenu) contextMenu.remove();\n\t\tif (selectedCells.size === 0) return;\n\n\t\tconst table = document.getElementById('mainBiomeTable');\n\t\tif (!table) return;\n\n\t\t// Read actual column widths and row heights from the live DOM\n\t\tconst thEls = Array.from(table.querySelectorAll('thead th'));\n\t\tconst domColWidths = thEls.map(th => th.offsetWidth);\n\t\tconst firstDataRow = table.querySelector('tbody tr');\n\t\tconst DOM_ROW_H = firstDataRow ? firstDataRow.offsetHeight : 26;\n\t\tconst DOM_HDR_H = thEls.length > 0 ? thEls[0].offsetHeight : 30;\n\n\t\tconst rowsMap = new Map();\n\t\tselectedCells.forEach(key => {\n\t\t\tconst [rowIdx, colIdx] = key.split(':').map(Number);\n\t\t\tif (!rowsMap.has(rowIdx)) rowsMap.set(rowIdx, new Map());\n\t\t\trowsMap.get(rowIdx).set(colIdx, true);\n\t\t});\n\n\t\tconst colIdxSet = new Set([...selectedCells].map(k => parseInt(k.split(':')[1])));\n\t\tconst sortedColIdxs = [...colIdxSet].sort((a, b) => a - b);\n\t\tconst sortedRowIdxs = [...rowsMap.keys()].sort((a, b) => a - b);\n\t\tconst headers = sortedColIdxs.map(ci => currentDataLabelsCache[ci] || currentDataColumnsCache[ci]);\n\t\tconst tableRows = sortedRowIdxs.map(ri => sortedColIdxs.map(ci => {\n\t\t\treturn getSegbCellText(rowCache[ri], currentDataColumnsCache[ci]);\n\t\t}));\n\n\t\tconst colWidths = sortedColIdxs.map(ci => domColWidths[ci] || 100);\n\t\tconst ROW_H = DOM_ROW_H;\n\t\tconst HDR_H = DOM_HDR_H;\n\t\tconst CP = 12;\n\n\t\tconst canvas = document.createElement('canvas');\n\t\tconst ctx = canvas.getContext('2d');\n\t\tconst FONT = '13px Consolas, monospace';\n\t\tconst HDR_FONT = 'bold 13px Consolas, monospace';\n\t\tconst META_FONT = '12px Segoe UI, sans-serif';\n\t\tconst BORDER_CLR = '#90EE90';\n\t\tconst BW = 6, PAD = 14, META_LH = 20;\n\n\t\tconst tableW = colWidths.reduce((s, w) => s + w, 0);\n\t\tctx.font = META_FONT;\n\t\tconst filePath = new URLSearchParams(window.PE_SEARCH).get('path') || '(unknown)';\n\t\tconst metaW = Math.max(\n\t\t\tctx.measureText('File: ' + filePath).width,\n\t\t\tctx.measureText('Table: SEGB Entries').width\n\t\t);\n\t\tconst totalW = Math.max(tableW, metaW) + PAD * 2 + BW * 2;\n\t\tconst metaH = META_LH * 2 + PAD * 2;\n\t\tconst tableH = HDR_H + tableRows.length * ROW_H;\n\t\tconst totalH = BW * 2 + metaH + tableH + PAD;\n\n\t\tcanvas.width = totalW;\n\t\tcanvas.height = totalH;\n\n\t\tconst CORNER_R = 10;\n\t\tctx.save();\n\t\tctx.beginPath();\n\t\tctx.roundRect(BW / 2, BW / 2, totalW - BW, totalH - BW, CORNER_R);\n\t\tctx.clip();\n\t\tctx.fillStyle = '#0d1117';\n\t\tctx.fillRect(0, 0, totalW, totalH);\n\n\t\tconst metaX = BW + PAD;\n\t\tlet metaY = BW + PAD + META_LH;\n\t\tctx.font = META_FONT;\n\t\tctx.fillStyle = '#8b949e';\n\t\tctx.fillText('File:', metaX, metaY);\n\t\tctx.fillStyle = '#e6edf3';\n\t\tctx.fillText(' ' + filePath, metaX + ctx.measureText('File:').width, metaY);\n\t\tmetaY += META_LH;\n\t\tctx.fillStyle = '#8b949e';\n\t\tctx.fillText('View:', metaX, metaY);\n\t\tctx.fillStyle = '#e6edf3';\n\t\tctx.fillText(' SEGB Entries', metaX + ctx.measureText('View:').width, metaY);\n\n\t\tconst tblX = BW + PAD;\n\t\tconst tblY = BW + metaH;\n\n\t\tctx.fillStyle = '#21262d';\n\t\tctx.fillRect(tblX, tblY, tableW, HDR_H);\n\t\tctx.font = HDR_FONT;\n\t\tctx.fillStyle = '#58a6ff';\n\t\tlet xOff = tblX + CP;\n\t\theaders.forEach((h, i) => {\n\t\t\tfillTextEllipsis(ctx, h, xOff, tblY + HDR_H / 2 + 4, colWidths[i] - CP * 2);\n\t\t\txOff += colWidths[i];\n\t\t});\n\n\t\tctx.font = FONT;\n\t\ttableRows.forEach((row, ri) => {\n\t\t\tconst y = tblY + HDR_H + ri * ROW_H;\n\t\t\tctx.fillStyle = ri % 2 === 0 ? '#0d1117' : '#161b22';\n\t\t\tctx.fillRect(tblX, y, tableW, ROW_H);\n\t\t\tctx.fillStyle = '#e6edf3';\n\t\t\tlet xOff = tblX + CP;\n\t\t\trow.forEach((cell, ci) => {\n\t\t\t\tfillTextEllipsis(ctx, cell, xOff, y + ROW_H / 2 + 4, colWidths[ci] - CP * 2);\n\t\t\t\txOff += colWidths[ci];\n\t\t\t});\n\t\t});\n\n\t\tctx.strokeStyle = '#30363d';\n\t\tctx.lineWidth = 1;\n\t\t[0, HDR_H, ...tableRows.map((_, i) => HDR_H + (i + 1) * ROW_H)].forEach(dy => {\n\t\t\tctx.beginPath(); ctx.moveTo(tblX, tblY + dy); ctx.lineTo(tblX + tableW, tblY + dy); ctx.stroke();\n\t\t});\n\t\tlet vx = tblX;\n\t\t[0, ...colWidths].forEach(w => {\n\t\t\tctx.beginPath(); ctx.moveTo(vx, tblY); ctx.lineTo(vx, tblY + tableH); ctx.stroke();\n\t\t\tvx += w;\n\t\t});\n\n\t\tctx.restore();\n\t\tctx.strokeStyle = BORDER_CLR;\n\t\tctx.lineWidth = BW;\n\t\tctx.beginPath();\n\t\tctx.roundRect(BW / 2, BW / 2, totalW - BW, totalH - BW, CORNER_R);\n\t\tctx.stroke();\n\n\t\tcanvas.toBlob(blob => {\n\t\t\tconst url = URL.createObjectURL(blob);\n\t\t\tconst a = document.createElement('a');\n\t\t\ta.href = url;\n\t\t\ta.download = 'segb_selection.png';\n\t\t\tdocument.body.appendChild(a);\n\t\t\ta.click();\n\t\t\tdocument.body.removeChild(a);\n\t\t\tURL.revokeObjectURL(url);\n\t\t});\n\t}\n\n\t// ==================== DATA MODAL ====================\n\tfunction openDataModal(rowIndex) {\n\t\tconst entry = rowCache[rowIndex];\n\t\tif (!entry) return;\n\t\tcurrentModalData = entry;\n\n\t\tdocument.getElementById('modalTitle').innerText = `Entry ${entry.index} | ${entry.offset_hex} | ${entry.state}`;\n\n\t\t// Default to decoded tab\n\t\tswitchModalTab('decoded', document.querySelector('.modal-tab'));\n\t\tdocument.getElementById('dataModal').style.display = 'flex';\n\t}\n\n\tfunction closeDataModal() {\n\t\tdocument.getElementById('dataModal').style.display = 'none';\n\t\tcurrentModalData = null;\n\t}\n\n\tfunction switchModalTab(tab, el) {\n\t\tdocument.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));\n\t\tel.classList.add('active');\n\n\t\tconst body = document.getElementById('modalBody');\n\t\tif (!currentModalData) return;\n\n\t\tif (tab === 'decoded') {\n\t\t\trenderDecodedContent(body, entry);\n\t\t} else if (tab === 'hex') {\n\t\t\t// Full hex dump from base64\n\t\t\ttry {\n\t\t\t\tconst raw = atob(currentModalData.data_b64);\n\t\t\t\tlet hexDump = '';\n\t\t\t\tfor (let i = 0; i < raw.length; i += 16) {\n\t\t\t\t\tconst slice = raw.slice(i, i + 16);\n\t\t\t\t\tconst offset = (i).toString(16).padStart(8, '0');\n\t\t\t\t\tconst hexBytes = Array.from(slice).map(c => c.charCodeAt(0).toString(16).padStart(2, '0')).join(' ').padEnd(47, ' ');\n\t\t\t\t\tconst ascii = Array.from(slice).map(c => { const code = c.charCodeAt(0); return code >= 32 && code <= 126 ? c : '.'; }).join('');\n\t\t\t\t\thexDump += `${offset}  ${hexBytes}  |${ascii}|\\n`;\n\t\t\t\t}\n\t\t\t\tbody.innerHTML = `<div>${escapeHtml(hexDump)}<\/div>`;\n\t\t\t} catch(e) {\n\t\t\t\tbody.innerHTML = `<div class=\"error\">Failed to decode: ${e.message}<\/div>`;\n\t\t\t}\n\t\t} else if (tab === 'raw') {\n\t\t\tbody.innerHTML = `<div style=\"word-break: break-all;\">${escapeHtml(currentModalData.data_b64)}<\/div>`;\n\t\t}\n\t}\n\n\t// ==================== JUMP TO HEX ====================\n\tfunction jumpToEntryInHex(rowIndex) {\n\t\tconst entry = rowCache[rowIndex];\n\t\tif (!entry) return;\n\t\tif (contextMenu) contextMenu.remove();\n\n\t\t// Store pending jump\n\t\twindow.pendingJump = {\n\t\t\toffset: entry.data_offset || entry.offset,\n\t\t\tsize: entry.data_size || 32,\n\t\t};\n\n\t\t// Switch to hex tab\n\t\tconst hexTab = Array.from(document.querySelectorAll('.tab')).find(t => t.innerText === 'Hex View');\n\t\tif (hexTab) switchMode('hex', hexTab);\n\t}\n\n\t// ==================== EXTERNAL BLOB VIEWER ====================\n\tasync function analyzeBlob(b64Data, mode) {\n\t\ttry {\n\t\t\tconst res = await fetch(`${apiBase}/analyze-blob`, {\n\t\t\t\tmethod: 'POST',\n\t\t\t\theaders: { 'Content-Type': 'application/json' },\n\t\t\t\tbody: JSON.stringify({ data: b64Data, mode: mode })\n\t\t\t});\n\t\t\tconst data = await res.json();\n\t\t\t\n\t\t\tif (data.status === 'success' && data.url) {\n\t\t\t\t// Open the appropriate viewer (Plist, PNG, SQLite, etc.) in a new tab\n\t\t\t\tPE.open(data.url, '_blank');\n\t\t\t} else {\n\t\t\t\talert('Error analyzing blob: ' + (data.message || 'Unknown error'));\n\t\t\t}\n\t\t} catch (e) {\n\t\t\talert('Network Error: ' + e.message);\n\t\t}\n\t}\n\n\t// ==================== HEX VIEW ====================\n\tasync function loadHexView() {\n        if (!editor) return;\n\n\t\ttry {\n\t\t\tconst hexRes = await (await fetch(`${apiBase}/get-hex?path=${encodeURIComponent(path)}&page=1&size=104857600`)).json();\n\n\t\t\tif (hexRes.error) {\n\t\t\t\teditor.setValue(`[Error loading hex: ${hexRes.error}]`);\n\t\t\t\treturn;\n\t\t\t}\n\n\t\t\teditor.setValue(hexRes.lines);\n\n\t\t\t// Apply structural annotations\n\t\t\tsetTimeout(() => applyHexAnnotations(), 50);\n\n\t\t\t// Handle pending jump\n\t\t\tif (window.pendingJump) {\n\t\t\t\tsetTimeout(() => {\n\t\t\t\t\tjumpToOffsetFull(window.pendingJump.offset, window.pendingJump.size);\n\t\t\t\t\twindow.pendingJump = null;\n\t\t\t\t}, 100);\n\t\t\t}\n\t\t} catch (e) {\n\t\t\teditor.setValue(`[Failed to load hex: ${e.message}]`);\n\t\t}\n    }\n\n\tfunction applyHexAnnotations() {\n\t\tif (!editor || !hexRegions || hexRegions.length === 0) return;\n\n\t\tlet newDecorations = [];\n\n\t\thexRegions.forEach(region => {\n\t\t\tconst startByte = region.offset;\n\t\t\tlet bytesRemaining = region.size;\n\t\t\tlet currentOffset = startByte;\n\n\t\t\twhile (bytesRemaining > 0) {\n\t\t\t\tconst row = Math.floor(currentOffset / 16);\n\t\t\t\tconst col = currentOffset % 16;\n\n\t\t\t\t// If
